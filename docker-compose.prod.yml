services:
  db:
    image: postgres:15-alpine
    container_name: schoolmanage-test-db
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=schoolmanage_test
    networks:
      - schoolmanage_default
    restart: always

  backend-test:
    container_name: schoolmanage-test-api
    depends_on:
      - db
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - static_volume_test:/app/static
      - media_volume_test:/app/media
    environment:
      # Force UTF-8 encoding to prevent migration decoding errors
      - PYTHONIOENCODING=utf-8
      - PYTHONDEFAULTENCODING=utf-8
      - DATABASE_URL=postgres://app_user:secure_password@db:5432/schoolmanage_test
      - DEBUG=0
      - SECRET_KEY=test_secret_key_123
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - CSRF_TRUSTED_ORIGINS=http://72.60.2.96:8080
    # On force la connexion au réseau du container de prod pour voir la DB
    networks:
      - schoolmanage_default 
    restart: always

  frontend-test:
    container_name: schoolmanage-test-app
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80" # ACCÈS SUR LE PORT 8080
    volumes:
      - ./releases:/app/releases
    depends_on:
      - backend-test
    networks:
      - schoolmanage_default
    restart: always

  frontend-react:
    container_name: schoolmanage-react
    build:
      context: ./Eteyelo.ethernanos.space
      dockerfile: Dockerfile
    networks:
      - schoolmanage_default
    restart: always

  nginx-router:
    image: nginx:alpine
    container_name: schoolmanage-router
    ports:
      - "9005:80"
    volumes:
      - ./nginx-saas.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-test
      - frontend-test
      - frontend-react
    networks:
      - schoolmanage_default
    restart: always

networks:
  schoolmanage_default:
    driver: bridge

volumes:
  static_volume_test:
  media_volume_test:
  postgres_data_test:
