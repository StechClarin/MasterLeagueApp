name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on any version tag like v1.0.0

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Frontend (Angular)
        shell: bash
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build -- --base-href /
          cd ..
          rm -rf frontend_build
          mkdir -p frontend_build
          cp -R frontend/dist/frontend/browser/* frontend_build/

      - name: Arm Hub Settings
        shell: bash
        run: |
          echo "Switching to Hub Production Settings (v7.6)..."
          cp config/settings_hub.py config/settings.py

      - name: Compile Backend (PyInstaller)
        shell: bash
        run: |
          # 1. Pre-generate OS-specific manifest for the build
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXE_NAME="schoolmanage.exe"
          else
            EXE_NAME="schoolmanage"
          fi
          
          cat <<EOF > ethernanos.json
          {
            "name": "schoolmanage",
            "version": "${GITHUB_REF#refs/tags/v}",
            "port": 8000,
            "exec_command": "$EXE_NAME"
          }
          EOF
          
          # 2. Run PyInstaller
          pyinstaller app.spec
          
          # 3. Forcer le manifest et le script bash à la racine (PyInstaller le cache parfois dans _internal)
          cp ethernanos.json dist/schoolmanage/
          if [ -f hub_start.sh ]; then cp hub_start.sh dist/schoolmanage/; fi

      - name: Prepare Artifact
        shell: bash
        run: |
          # Detect Version from Tag
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" = "$GITHUB_REF" ]; then VERSION="latest"; fi
          
          # 1. Déterminer l'OS cible pour éviter l'écrasement
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            OS_SUFFIX="win"
          else
            OS_SUFFIX="linux"
          fi
          
          ARCHIVE_NAME="schoolmanage-${OS_SUFFIX}.tar.gz"
          META_NAME="metadata-${OS_SUFFIX}.json"
          
          # 2. Archiver le dossier (Mode OneDir)
          echo "Packaging folder into $ARCHIVE_NAME..."
          cd dist/schoolmanage
          tar -czf "../../$ARCHIVE_NAME" .
          cd ../..
          
          # 3. Hash calculation of the ARCHIVE (as expected by the Hub)
          HASH=$(sha256sum $ARCHIVE_NAME | awk '{ print $1 }')
          
          # 4. Prepare deploy directory
          mkdir -p deploy_dir
          mv $ARCHIVE_NAME deploy_dir/
          
          # 5. Generate Metadata with OS Specifier
          cat <<EOF > deploy_dir/$META_NAME
          {
            "app": "schoolmanage",
            "version": "$VERSION",
            "hash": "$HASH",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "archive": "$ARCHIVE_NAME",
            "os": "${{ matrix.os }}"
          }
          EOF

      - name: Upload Artifact (GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: deploy_dir/*

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Prepare combined deployment
        run: |
          mkdir -p final_deploy
          # Move all files from subdirectories to the root of final_deploy
          find all-releases -type f -exec mv {} final_deploy/ \;

      - name: Deploy to Server (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "final_deploy/*"
          target: "${{ secrets.SERVER_PATH }}/${{ github.ref_name }}"
          strip_components: 1
          rm: true
          timeout: 600s
          use_insecure_cipher: true
