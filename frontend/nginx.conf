server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Angular SPA Route (Subpath)
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://backend-test:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/api/ {
        rewrite ^/admin/api/(.*) /api/$1 break;
        proxy_pass http://backend-test:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL Proxy
    location /graphql {
        proxy_pass http://backend-test:8000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/graphql {
        proxy_pass http://backend-test:8000/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin Proxy
    location /django-admin/ {
        proxy_pass http://backend-test:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Icons (Vector SVG End-to-End)
    location /static/icons/ {
        alias /usr/share/nginx/html/static/icons/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static Files (Django Admin & Core)
    location /static/ {
        alias /app/static/;
    }

    # Media Files aa
    location /media/ {
        alias /app/media/;
    }

    # Releases for EtherNanos
    location /schoolmanage/test/releases/ {
        alias /app/releases/;
        autoindex on;
    }
}
