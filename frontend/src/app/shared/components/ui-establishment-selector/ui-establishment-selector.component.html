<!-- Sélecteur d'établissement : déclencheur + menu déroulant avec recherche distante -->
<div class="establishment-selector-root relative" (click)="$event.stopPropagation()">

    <!-- Déclencheur -->
    <button
        type="button"
        (click)="toggleOpen()"
        [attr.aria-expanded]="isOpen()"
        class="min-w-[220px] flex items-center gap-2.5 py-2 pl-3 pr-2.5 bg-white text-gray-700 text-sm rounded-lg border border-gray-200 hover:border-indigo-300 hover:bg-indigo-50/40 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition-all cursor-pointer text-left">
        <svg class="w-4 h-4 text-indigo-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m8-2a2 2 0 100-4 2 2 0 000 4"></path>
        </svg>
        <span class="flex-1 font-medium truncate" [title]="selectedLabel()">{{ selectedLabel() }}</span>
        <svg class="w-4 h-4 text-gray-400 transition-transform duration-200" [class.rotate-180]="isOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    <!-- Panneau déroulant (hauteur limitée + défilement interne garanti) -->
    <div
        *ngIf="isOpen()"
        class="absolute right-0 top-full mt-2 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 z-[70] flex flex-col"
        style="max-height: min(28rem, calc(100vh - 120px)); min-width: 280px; overflow: hidden;">

        <!-- Champ de recherche distante -->
        <div class="relative p-2 border-b border-gray-100 shrink-0">
            <svg class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input
                #searchInput
                type="text"
                autocomplete="off"
                role="combobox"
                [value]="searchText()"
                (input)="onSearchInput($event)"
                (keydown)="onListKeydown($event)"
                placeholder="Rechercher un établissement…"
                class="w-full pl-9 pr-8 py-2 bg-gray-50 border border-gray-200 text-sm text-gray-700 placeholder-gray-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 focus:bg-white transition-all" />

            <!-- Spinner recherche distante -->
            <svg *ngIf="isSearching()"
                class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-indigo-500 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
        </div>

        <!-- Liste déroulante (SCROLLABLE — hauteur max 22rem, scrollbar fine) -->
        <ul class="flex-1 min-h-0 py-1 overscroll-contain"
            style="max-height: 22rem; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;"
            role="listbox" aria-label="Établissements">
            <li *ngFor="let item of list(); let i = index"
                role="option"
                [attr.aria-selected]="i === highlightedIndex()"
                (mouseenter)="highlightedIndex.set(i)"
                (click)="selectId(item.id)"
                class="px-3 py-2 flex items-center gap-2.5 cursor-pointer transition-colors"
                [ngClass]="{
                    'bg-indigo-50 text-indigo-700': i === highlightedIndex(),
                    'text-gray-700 hover:bg-gray-50': i !== highlightedIndex()
                }">

                <ng-container *ngIf="item.id; else allEstIcon">
                    <span class="h-8 w-8 rounded-lg flex items-center justify-center shrink-0"
                        [ngClass]="i === highlightedIndex() ? 'bg-indigo-100 text-indigo-600' : 'bg-indigo-50 text-indigo-500'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m8-2a2 2 0 100-4 2 2 0 000 4"></path>
                        </svg>
                    </span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-sm font-semibold truncate">{{ item.name }}</span>
                        <span *ngIf="item.city || item.country" class="block text-[11px] text-gray-400 truncate">
                            {{ item.city || '—' }}{{ (item.city && item.country) ? ', ' : '' }}{{ item.country || '' }}
                        </span>
                    </span>
                </ng-container>

                <ng-template #allEstIcon>
                    <span class="h-8 w-8 rounded-lg flex items-center justify-center shrink-0"
                        [ngClass]="i === highlightedIndex() ? 'bg-slate-200 text-slate-600' : 'bg-slate-100 text-slate-500'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                    </span>
                    <span class="flex-1 text-sm font-medium text-gray-500">{{ item.name }}</span>
                </ng-template>

                <!-- Check établissement actuellement sélectionné -->
                <svg *ngIf="item.id && structureState.currentEstablishmentId() === item.id"
                    class="w-4 h-4 text-indigo-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                </svg>
            </li>
        </ul>

        <!-- État vide -->
        <div *ngIf="!isSearching() && filteredOptions().length === 0" class="px-4 py-6 text-center">
            <p class="text-sm text-gray-500 font-medium">
                {{ structureState.isLoading() ? 'Chargement des établissements…' : 'Aucun établissement trouvé.' }}
            </p>
        </div>

        <!-- Pied : aides clavier -->
        <div class="flex items-center gap-3 px-3 py-1.5 bg-gray-50 border-t border-gray-100 text-[10px] text-gray-400 shrink-0">
            <span><kbd class="px-1 py-0.5 bg-white border border-gray-200 rounded">↑↓</kbd> naviguer</span>
            <span><kbd class="px-1 py-0.5 bg-white border border-gray-200 rounded">Entrée</kbd> valider</span>
            <span><kbd class="px-1 py-0.5 bg-white border border-gray-200 rounded">Échap</kbd> fermer</span>
            <span *ngIf="isSearching()" class="ml-auto text-indigo-400 font-medium">Recherche distante…</span>
        </div>
    </div>
</div>
