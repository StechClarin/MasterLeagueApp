# --- PLANNING ---
query GetAllPlannings($search: String, $minDate: Date, $maxDate: Date, $page: Int, $pageSize: Int) {
  plannings(search: $search, minDate: $minDate, maxDate: $maxDate, page: $page, pageSize: $pageSize) {
    items {
      id
      nom
      dateStart
      dateEnd
      isTemplate
      establishment {
        id
        name
      }
      details {
        id
        date
        heureDebut
        heureFin
        enseignant { 
            id 
            matricule 
            user { firstName lastName }
        } 
        classe { id name }
        matiere { id name }
        salle { id name }
      }
    }
    totalCount
    numPages
  }
}

query GetPlanningDetails($search: String, $classeId: ID, $minDate: Date, $maxDate: Date, $page: Int, $pageSize: Int) {
  planningDetails(search: $search, classeId: $classeId, minDate: $minDate, maxDate: $maxDate, page: $page, pageSize: $pageSize) {
    items {
      id
      date
      heureDebut
      heureFin
      enseignant { 
          id 
          matricule 
          user { firstName lastName }
      } 
      classe { id name }
      matiere { id name }
      salle { id name }
    }
    totalCount
    numPages
  }
}

query GetPlanningById($id: ID!) {
  planning(id: $id) {
    id
    nom
    dateStart
    dateEnd
    isTemplate
    details {
       id
       date
       heureDebut
       heureFin
       enseignant { 
           id 
           matricule 
           user { firstName lastName }
       } 
       classe { id name }
       matiere { id name }
       salle { id name }
    }
  }
}

query GetPlanningDependencies {
   personnels(search: "", page: 1, pageSize: 100) {
       items { 
           id 
           matricule
           roles { name }
           user { firstName lastName } 
       }
   }
   subjects(search: "", page: 1, pageSize: 100) {
       items { id name }
   }
   classrooms(search: "", page: 1, pageSize: 100) {
       items { id name }
   }
   rooms(search: "", page: 1, pageSize: 100) {
       items { id name }
   }
   academicyears(search: "", page: 1, pageSize: 100) {
       items { 
           id 
           name 
           isActive
           startDate: start_date
           cycleConfigs {
               id
               cycle { id }
               startDate
           }
       }
   }
}

# --- TEACHING ASSIGNMENTS ---
query GetAllTeachingAssignments($search: String, $page: Int, $pageSize: Int) {
  teachingAssignments(search: $search, page: $page, pageSize: $pageSize) {
    items {
      id
      startDate
      endDate
      hoursScheduled
      personnel {
        id
        user {
          firstName
          lastName
        }
      }
      classroom {
        id
        name
      }
      subject {
        id
        name
      }
      academicYear {
        id
        name
      }
    }
    totalCount
    numPages
    currentPage
  }
}

query GetTeachingAssignment($id: ID!) {
  teachingAssignment(id: $id) {
    id
    startDate
    endDate
    hoursScheduled
    personnel {
      id
      user {
        firstName
        lastName
      }
    }
    classroom {
      id
      name
    }
    subject {
      id
      name
    }
    academicYear {
      id
      name
    }
  }
}
