<app-ui-list-page
  title="Gestions des Plannings"
  [isLoading]="isLoading()"
  [isEmpty]="isEmpty() && viewMode() === 'list'"
  (create)="openModal(null, 'create')"
  (refresh)="refresh()"
>
  <ng-container header-actions>
     <div class="flex items-center gap-4 w-full">
         <!-- Tabs -->
         <div class="flex p-1 bg-gray-100 rounded-lg">
             <button 
                (click)="switchView('list')"
                [class.bg-white]="viewMode() === 'list'"
                [class.shadow-sm]="viewMode() === 'list'"
                class="px-4 py-2 rounded-md text-sm font-medium transition-all duration-200"
                [class.text-gray-900]="viewMode() === 'list'"
                [class.text-gray-500]="viewMode() !== 'list'"
             >
                Liste
             </button>
             <button 
                (click)="switchView('calendar')"
                [class.bg-white]="viewMode() === 'calendar'"
                [class.shadow-sm]="viewMode() === 'calendar'"
                class="px-4 py-2 rounded-md text-sm font-medium transition-all duration-200"
                [class.text-gray-900]="viewMode() === 'calendar'"
                [class.text-gray-500]="viewMode() !== 'calendar'"
             >
                Calendrier
             </button>
         </div>

         <div class="flex-1"></div>

         <app-ui-toolbar *ngIf="viewMode() === 'list'" [searchControl]="searchControl" placeholder="Rechercher un planning...">
             <button (click)="openModal(null, 'create')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-2 transition-colors font-medium text-sm shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Nouveau Planning
             </button>
         </app-ui-toolbar>
     </div>
  </ng-container>

  <ng-container table>
    <!-- List View -->
    <ng-container *ngIf="viewMode() === 'list'">
        <app-ui-table
        [columns]="columns"
        [data]="data()"
        ></app-ui-table>

        <!-- Custom Actions Template -->
        <ng-template #actionsCell let-item>
          <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
            (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">
    
            <!-- Trigger -->
            <button trigger
              class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
              [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
              <span class="sr-only">Options</span>
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
              </svg>
            </button>
    
            <!-- Menu Content -->
            <div menu class="flex items-center gap-1">
    
                <!-- Calendar (Specific to Planning) -->
                <button (click)="openCalendar(item)"
                    class="p-2 rounded-full text-emerald-600 hover:bg-emerald-50 hover:text-emerald-700 transition-colors relative group/btn"
                    title="Voir Calendrier">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
    
                <!-- Edit -->
                <button (click)="onEdit(item)"
                    class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
                    title="Modifier">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                    </svg>
                </button>
    
                <div class="w-px h-6 bg-gray-200 mx-1"></div>
    
                <!-- Delete -->
                <button (click)="onDelete(item)"
                    class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
                    title="Supprimer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                    </svg>
                </button>
            </div>
          </app-ui-dropdown>
        </ng-template>
    </ng-container>

    <!-- Calendar View -->
    <div *ngIf="viewMode() === 'calendar'" class="w-full h-full min-h-[600px] bg-white rounded-lg p-6">
        <ng-container *ngIf="(selectedPlanning() || mergedPlanning()) as displayPlanning">
            <div class="mb-6 flex justify-between items-center bg-gray-50 p-4 rounded-lg border border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-900 leading-tight">
                            {{ displayPlanning.nom }}
                        </h2>
                        <div class="flex items-center text-sm text-gray-500 mt-0.5">
                            <span>Du {{ displayPlanning.dateStart | date:'shortDate' }} au {{ displayPlanning.dateEnd | date:'shortDate' }}</span>
                            <!-- Button to switch back to global view if a specific planning is selected -->
                            <button *ngIf="selectedPlanning()" (click)="selectedPlanning.set(null)" 
                                class="ml-3 text-xs font-medium text-indigo-600 hover:text-indigo-800 hover:underline flex items-center gap-1 transition-colors">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                                Voir Vue Globale
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <app-planning-resource-grid [planning]="displayPlanning"></app-planning-resource-grid>
        </ng-container>

        <!-- Empty State (Only if absolutely no plannings exist) -->
        <ng-container *ngIf="!selectedPlanning() && !mergedPlanning()">
            <div class="flex flex-col items-center justify-center h-96 text-gray-400 bg-gray-50 rounded-lg border-2 border-dashed border-gray-200">
                <svg class="w-16 h-16 mb-4 opacity-50 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-lg font-medium text-gray-500">Aucun planning disponible</p>
                <p class="text-sm mb-6 max-w-xs text-center">Commencez par créer un planning pour voir apparaître la grille des ressources.</p>
                <button (click)="openModal(null, 'create')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium text-sm transition-colors shadow-sm">
                    Créer un planning
                </button>
            </div>
        </ng-container>
    </div>
  </ng-container>
  
  <ng-container pagination>
     <!-- Pagination handles itself or is projected -->
  </ng-container>
</app-ui-list-page>

<!-- Edit/Create Modal -->
<app-ui-modal [isOpen]="isModalOpen()" (close)="closeModal()" maxWidth="sm:max-w-4xl">
  <ng-container [ngSwitch]="modalMode()">
      <app-ui-confirm-modal *ngSwitchCase="'delete'"
          title="Supprimer le planning ?"
          message="Cette action est irréversible."
          (confirm)="confirmDelete()"
          (cancel)="closeModal()"
      ></app-ui-confirm-modal>
      
      <app-planning-form *ngSwitchDefault
         [item]="selectedItem()"
         (cancel)="closeModal()"
         (success)="onModalSuccess()"
      ></app-planning-form>
  </ng-container>
</app-ui-modal>
