# ==============================================================================
# FRAGMENTS
# ==============================================================================

fragment AcademicYearFields on AcademicYearType {
  id
  name
  start_date
  end_date
  isActive
  isArchived
  cycleConfigs {
    id
    cycle {
      id
    }
    startDate
  }
}

fragment CycleFields on CycleType {
  id
  name
  code
  description
  order
  isActive
  hasOptions
  establishment {
    id
    name
  }
}

fragment OptionFields on OptionType {
  id
  name
  code
  isActive
  cycle {
    id
    name
  }
  parent {
    id
    name
  }
  establishment {
    id
  }
}

fragment LevelFields on LevelType {
  id
  name
  shortName
  order
  isActive
  cycle {
    id
    name
    hasOptions
    establishment {
        id
        name
    }
  }
}

fragment SubjectGroupFields on SubjectGroupType {
  id
  name
  establishment {
    id
    name
  }
}

fragment ClassRoomFields on ClassRoomType {
  id
  name
  capacity
  isActive
  level {
    ...LevelFields
  }
  option {
    ...OptionFields
  }
  academicYear {
    id
    name
  }
}

fragment LevelSubjectFields on LevelSubjectType {
  id
  coefficient
  hourlyQuota
  credits
  group {
    ...SubjectGroupFields
  }
  level {
    id
    name
  }
  option {
    id
    name
  }
}

fragment SubjectFields on SubjectType {
  id
  name
  code
  isOptional
  isActive
  levelSubjects {
    ...LevelSubjectFields
  }
}

fragment AcademicPeriodFields on AcademicPeriodType {
  id
  name
  startDate
  endDate
  isActive
  academicYear {
    id
    name
  }
}

fragment RoomFields on RoomType {
  id
  name
  capacity
}

fragment StructureResponse on StructureResponseType {
  activeAcademicYear {
    id
    name
    start_date
    end_date
    isActive
    isArchived
  }
  cycles {
    ...CycleFields
    levels {
      ...LevelFields
    }
  }
}

# ==============================================================================
# QUERIES (Read-Only for now)
#Matches backend: academicyears -> [AcademicYearType]
# ==============================================================================

query GetAllAcademicYears($search: String, $isActive: Boolean, $isArchived: Boolean, $page: Int, $pageSize: Int) {
  academicyears(search: $search, isActive: $isActive, isArchived: $isArchived, page: $page, pageSize: $pageSize) {
    items {
      ...AcademicYearFields
    }
    totalCount
    numPages
    currentPage
  }
}

query GetAcademicYearById($id: ID!) {
  academicyear(id: $id) {
    ...AcademicYearFields
  }
}

query GetAllCycles($search: String, $establishmentId: ID, $page: Int, $pageSize: Int) {
  cycles(search: $search, establishmentId: $establishmentId, page: $page, pageSize: $pageSize) {
    items {
