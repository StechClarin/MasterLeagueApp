<ng-container *ngIf="!isEmbedded">
    <app-ui-list-page title="Gestion des Cycles" [isLoading]="isLoading()" (refresh)="refresh()" (add)="openModal()"
        (export)="onExport()" (import)="onImport()">

        <ng-container header-actions>
            <app-ui-toolbar [searchControl]="searchControl" (toggleFilters)="toggleFilters()">
            </app-ui-toolbar>
        </ng-container>

        <ng-container table>
            <ng-container *ngTemplateOutlet="tableContent"></ng-container>
        </ng-container>

        <ng-container pagination>
            <ng-container *ngTemplateOutlet="paginationContent"></ng-container>
        </ng-container>

        <ng-container modals>
            <ng-container *ngTemplateOutlet="modalContent"></ng-container>
        </ng-container>

    </app-ui-list-page>
</ng-container>

<ng-container *ngIf="isEmbedded">
    <div class="space-y-4">
        <ng-container *ngTemplateOutlet="tableContent"></ng-container>
        <ng-container *ngTemplateOutlet="paginationContent"></ng-container>
        <ng-container *ngTemplateOutlet="modalContent"></ng-container>
    </div>
</ng-container>

<ng-template #tableContent>
    <app-ui-table [columns]="tableColumns" [data]="(items$ | async) || []" [actionsTemplate]="actionsCell">
    </app-ui-table>
</ng-template>

<ng-template #paginationContent>
    <div class="mt-2">
        <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
            [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()" (goTo)="goToPage($event)">
        </app-ui-pagination>
    </div>
</ng-template>

<ng-template #modalContent>
    <app-ui-modal [isOpen]="isModalOpen()" (close)="closeModal()">
        <ng-container [ngSwitch]="modalMode()">
            <app-ui-confirm-modal *ngSwitchCase="'delete'" title="Supprimer le cycle ?"
                message="Êtes-vous sûr de vouloir supprimer ce cycle ?" (confirm)="confirmDelete()"
                (cancel)="closeModal()">
            </app-ui-confirm-modal>

            <app-cycle-form *ngSwitchDefault [cycle]="selectedItem()" (success)="onSave()" (cancel)="closeModal()">
            </app-cycle-form>
        </ng-container>
    </app-ui-modal>
</ng-template>

<ng-template #nameCell let-item>
    <div class="font-medium text-gray-900">{{ item.name }}</div>
</ng-template>

<ng-template #actionsCell let-item>
    <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
        (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

        <button trigger
            class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
            [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>

        <div menu class="flex items-center gap-1">
            <button (click)="openModal(item, 'edit')"
                class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                title="Modifier">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </button>

            <div class="w-px h-6 bg-gray-200 mx-1"></div>

            <button (click)="toggleStatus(item); closeMenu()"
                class="p-2 rounded-full transition-colors relative group/btn"
                [title]="item.isActive ? 'Désactiver' : 'Activer'" [class.text-red-500]="item.isActive"
                [class.hover:bg-red-50]="item.isActive" [class.text-green-500]="!item.isActive"
                [class.hover:bg-green-50]="!item.isActive">
                <svg *ngIf="item.isActive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636">
                    </path>
                </svg>
                <svg *ngIf="!item.isActive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </button>
            <button (click)="openModal(item, 'delete')"
                class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors"
                title="Supprimer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 2 0 00-1-1h-4a1 2 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </app-ui-dropdown>
</ng-template>
