<app-ui-list-page title="Cycles & Niveaux" [isLoading]="false">

    <!-- Header Actions (Search + Add) -->
    <ng-container header-actions>
        <app-ui-toolbar [searchControl]="searchControl"
            [placeholder]="activeTab() === 'cycles' ? 'Rechercher un cycle...' : 'Rechercher un niveau...'">
            
            <button (click)="onAdd()"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 transition-all shadow-lg flex items-center justify-center font-medium text-sm">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                {{ activeTab() === 'cycles' ? 'Nouveau Cycle' : 'Nouveau Niveau' }}
            </button>
        </app-ui-toolbar>
    </ng-container>

    <!-- Filters -->
    <ng-container filters>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
            <button (click)="onToggleFilters()"
                class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                </svg>
                Filtres
                <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
                    [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        </div>

        <app-ui-filter-panel
            [isOpen]="isFiltersOpen()"
            [form]="(activeTab() === 'cycles' ? cycleList?.filterForm : levelList?.filterForm) || fallbackForm"
            (reset)="activeTab() === 'cycles' ? cycleList?.resetFilters() : levelList?.resetFilters()">
            
            <ng-container *ngIf="activeTab() === 'levels' && levelList?.filterForm as levelFilterForm">
                <div [formGroup]="levelFilterForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                    <div class="space-y-1.5">
                        <label for="filter-cycle" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Cycle</label>
                        <select id="filter-cycle" formControlName="cycleId"
                            class="block w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                            <option value="">Tous les cycles</option>
                            <option *ngFor="let cycle of (levelList!.cycles$ | async) || []" [value]="cycle?.id">{{ cycle?.name }}</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label for="filter-abrev" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Abréviation</label>
                        <input type="text" id="filter-abrev" formControlName="shortName" placeholder="Ex: 6ème"
                            class="block w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                    </div>
                </div>
            </ng-container>

        </app-ui-filter-panel>
    </ng-container>

    <!-- Main Content: Tabs + Lists -->
    <ng-container table>

        <app-ui-tabs [tabs]="tabs" [currentTab]="activeTab()" (tabChange)="onTabChange($event)">

            <div [class.hidden]="activeTab() !== 'cycles'">
                <app-cycle-list [isEmbedded]="true" [showPagination]="false"></app-cycle-list>
            </div>

            <div [class.hidden]="activeTab() !== 'levels'">
                <app-level-list [isEmbedded]="true" [showPagination]="false"></app-level-list>
            </div>

        </app-ui-tabs>
    </ng-container>

    <!-- Pagination (Hoisted) -->
    <ng-container pagination>
        <div class="mt-2" *ngIf="activeTab() === 'cycles' ? cycleList : levelList">
            <app-ui-pagination 
                [currentPage]="(activeTab() === 'cycles' ? cycleList?.currentPage() : levelList?.currentPage()) ?? 1"
                [pageSize]="(activeTab() === 'cycles' ? cycleList?.pageSize() : levelList?.pageSize()) ?? 10"
                [totalCount]="(activeTab() === 'cycles' ? cycleList?.totalCount() : levelList?.totalCount()) ?? 0"
                [numPages]="(activeTab() === 'cycles' ? cycleList?.numPages() : levelList?.numPages()) ?? 0"
                (prev)="onPrevPage()"
                (next)="onNextPage()"
                (goTo)="onGoToPage($event)"
            ></app-ui-pagination>
        </div>
    </ng-container>

</app-ui-list-page>
