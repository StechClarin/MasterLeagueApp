<app-ui-list-page
    title="Groupes de Matières & UEs"
    description="Gérez les unités d'enseignement ou les regroupements (ex: Matières Littéraires, UE-INFO)"
    [isLoading]="isLoading()"
    [isEmpty]="totalCount() === 0">

    <ng-container header-actions>
        <button (click)="openModal(null, 'create')"
            class="px-4 py-2 bg-indigo-600 text-white rounded-xl shadow hover:bg-indigo-700 transition flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Nouveau Groupe
        </button>
    </ng-container>

    <div filters>
        <app-ui-toolbar
            [searchControl]="searchControl"
            searchPlaceholder="Rechercher par nom..."
            (search)="dispatchFilters()"
            (refresh)="refresh()"
            (filter)="toggleFilters()">
        </app-ui-toolbar>

        <!-- FILTERS PANEL -->
        <app-ui-filter-panel
            [isOpen]="isFiltersOpen()"
            [form]="filterForm"
            (reset)="resetFilters()">
        </app-ui-filter-panel>
    </div>

    <ng-container table>
        <!-- DATA TABLE -->
        <app-ui-table
            [columns]="tableColumns"
            [data]="(items$ | async) || []"
            [actionsTemplate]="actionsCell">
            
            <ng-template #nameCell let-item>
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 flex items-center justify-center rounded-xl bg-indigo-50 text-indigo-600 font-bold border border-indigo-100/50">
                        {{ item.name.charAt(0) }}
                    </div>
                    <div>
                        <div class="text-sm font-bold text-slate-800">{{ item.name }}</div>
                    </div>
                </div>
            </ng-template>
        </app-ui-table>
    </ng-container>

    <ng-container pagination>
        <!-- PAGINATION -->
        <div class="mt-4 pb-4">
            <app-ui-pagination
                [currentPage]="currentPage()"
                [pageSize]="pageSize()"
                [numPages]="numPages()"
                [totalCount]="totalCount()"
                (prev)="prevPage()"
                (next)="nextPage()"
                (goTo)="goToPage($event)">
            </app-ui-pagination>
        </div>
    </ng-container>
</app-ui-list-page>

<!-- MODALS -->
<ng-container modals>
    <app-ui-modal [isOpen]="isModalOpen()" (close)="closeModal()">
        <ng-container *ngIf="isModalOpen()">
            <ng-container [ngSwitch]="modalMode()">
                <app-ui-confirm-modal *ngSwitchCase="'delete'" 
                    title="Supprimer ce groupe"
                    message="Êtes-vous sûr de vouloir supprimer ce groupe ? Cette action est irréversible."
                    (confirm)="confirmDelete()"
                    (cancel)="closeModal()">
                </app-ui-confirm-modal>

                <app-subject-group-form *ngSwitchDefault
                    [subjectGroup]="selectedItem()"
                    [isReadOnly]="modalMode() === 'detail'"
                    (success)="onSave()"
                    (cancel)="closeModal()">
                </app-subject-group-form>
            </ng-container>
        </ng-container>
    </app-ui-modal>

    <!-- EXPORT -->
    <app-ui-export-modal
        [isOpen]="showExportModal()"
        [isExporting]="isExporting()"
        (close)="closeExportModal()"
        (confirm)="confirmExport($event)">
    </app-ui-export-modal>
</ng-container>

<!-- Cell Templates -->
<ng-template #actionsCell let-item>
    <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
        (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

        <button trigger
            class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
            [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>

        <div menu class="flex items-center gap-1">
            <button (click)="openModal(item, 'detail')"
                class="p-2 rounded-full text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                title="Détails">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>

            <button (click)="openModal(item, 'edit')"
                class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                title="Modifier">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </button>

            <div class="w-px h-6 bg-gray-200 mx-1"></div>

            <button (click)="openModal(item, 'delete')"
                class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors"
                title="Supprimer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </app-ui-dropdown>
</ng-template>
