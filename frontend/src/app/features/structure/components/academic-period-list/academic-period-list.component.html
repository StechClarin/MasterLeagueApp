<!-- Cell Templates -->
<ng-template #nameCell let-item>
    <div class="font-medium text-gray-900">{{ item.name }}</div>
</ng-template>

<ng-template #yearCell let-item>
    <div class="text-sm text-gray-600">
        {{ item.academicYear?.name }}
    </div>
</ng-template>

<ng-template #dateCell let-item>
    <div class="text-sm">
        <span class="text-gray-500">Du</span> {{ item.startDate | date:'dd/MM/yyyy' }}
        <span class="text-gray-500 mx-1">au</span> {{ item.endDate | date:'dd/MM/yyyy' }}
    </div>
</ng-template>

<ng-template #cyclesCell let-item>
    <div class="flex flex-wrap gap-1">
        <span *ngFor="let cycle of item.cycles" 
              class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
            {{ cycle.name }}
        </span>
        <span *ngIf="!item.cycles || item.cycles.length === 0" class="text-xs text-gray-400 italic">
            Aucun cycle
        </span>
    </div>
</ng-template>

<ng-template #statusCell let-item>
    <ng-container [ngSwitch]="getPeriodStatus(item)">
        <!-- Active -->
        <span *ngSwitchCase="'ACTIVE'" 
              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-100 shadow-sm">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
            Active
        </span>
        <!-- En clôture -->
        <span *ngSwitchCase="'CLOSING'" 
              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-100 shadow-sm"
              title="Date de fin théorique dépassée, en cours de clôture.">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5 animate-bounce"></span>
            En clôture
        </span>
        <!-- Clôturée -->
        <span *ngSwitchCase="'CLOSED'" 
              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-50 text-gray-600 border border-gray-200 shadow-sm">
            <svg class="w-3.5 h-3.5 mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            Clôturée
        </span>
        <!-- Inactive -->
        <span *ngSwitchDefault 
              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 border border-gray-200 shadow-sm">
            Inactive
        </span>
    </ng-container>
</ng-template>

<ng-template #actionsCell let-item>
    <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
        (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

        <button trigger
            class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
            [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>

        <div menu class="flex items-center gap-1">
            <button (click)="openModal(item, 'detail')"
                class="p-2 rounded-full text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                title="Détails">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>

            <button (click)="openModal(item, 'edit')"
                class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                title="Modifier">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </button>

            <div class="w-px h-6 bg-gray-200 mx-1"></div>

            <!-- Activité (Activer / Clôturer / Réouvrir) -->
            <ng-container [ngSwitch]="getPeriodStatus(item)">
                <!-- Si Active ou En Clôture: Option de clôturer -->
                <button *ngSwitchCase="'ACTIVE'" (click)="onClosePeriod(item); closeMenu()"
                    class="p-2 rounded-full text-amber-600 hover:bg-amber-50 transition-colors"
                    title="Clôturer la période">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                </button>
                
                <button *ngSwitchCase="'CLOSING'" (click)="onClosePeriod(item); closeMenu()"
                    class="p-2 rounded-full text-amber-600 hover:bg-amber-50 transition-colors"
                    title="Clôturer la période">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>
                    </svg>
                </button>

                <!-- Si Clôturée: Option de réouvrir -->
                <button *ngSwitchCase="'CLOSED'" (click)="onReopenPeriod(item); closeMenu()"
                    class="p-2 rounded-full text-emerald-600 hover:bg-emerald-50 transition-colors"
                    title="Réouvrir la période">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z">
                        </path>
                    </svg>
                </button>

                <!-- Si Inactive: Option de l'activer -->
                <button *ngSwitchDefault (click)="toggleStatus(item); closeMenu()"
                    class="p-2 rounded-full text-emerald-600 hover:bg-emerald-50 transition-colors"
                    title="Activer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </button>
            </ng-container>

            <button (click)="openModal(item, 'delete')"
                class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors"
                title="Supprimer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </app-ui-dropdown>
</ng-template>

<app-ui-list-page title="Périodes Académiques" [isLoading]="isLoading()">
    <!-- Header Actions (Search + Add) -->
    <ng-container header-actions>
        <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher une période...">
            <button (click)="openModal()"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center font-medium text-sm transform hover:-translate-y-0.5">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nouvelle Période
            </button>
        </app-ui-toolbar>
    </ng-container>

    <!-- Filters & Secondary Actions (Import/Export) -->
    <ng-container filters>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-2">
                <button (click)="toggleFilters()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filtres
                    <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
                        [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>

            <div class="flex items-center gap-3">
                <button (click)="onDownloadTemplate()"
                    class="px-4 py-2.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all flex items-center justify-center font-medium text-sm group border border-indigo-100">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Télécharger la trame
                </button>

                <button (click)="onImport()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-green-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-green-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Importer
                </button>
                <button (click)="openExportModal()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-blue-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Exporter
                </button>
            </div>
        </div>

        <app-ui-filter-panel [isOpen]="isFiltersOpen()" [form]="filterForm" (reset)="resetFilters()">
            <div [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <app-ui-select label="Année Scolaire" formControlName="academic_year"
                    [options]="(academicYears$ | async) || []" bindLabel="name" bindValue="id"></app-ui-select>

                <app-ui-select label="Statut" formControlName="isActive" [options]="[
                        { label: 'Tous', value: null },
                        { label: 'Actifs', value: true },
                        { label: 'Inactifs', value: false }
                    ]" bindLabel="label" bindValue="value"></app-ui-select>
            </div>
        </app-ui-filter-panel>
    </ng-container>

    <!-- Table -->
    <ng-container table>
        <app-ui-table [columns]="tableColumns" [data]="(items$ | async) || []" [actionsTemplate]="actionsCell">
        </app-ui-table>
    </ng-container>

    <!-- Pagination -->
    <ng-container pagination>
        <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
            [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()" (goTo)="goToPage($event)">
        </app-ui-pagination>
    </ng-container>

    <!-- Modals (Inside app-ui-list-page) -->
    <ng-container modals>
        <app-ui-modal [isOpen]="isModalOpen() && modalMode() !== 'delete'" (close)="closeModal()">
            <ng-container *ngIf="isModalOpen()">
                <ng-container [ngSwitch]="modalMode()">
                    <!-- Formulaire -->
                    <app-academic-period-form *ngSwitchDefault [item]="selectedItem()"
                        [isReadOnly]="modalMode() === 'detail'" (cancel)="closeModal()" (success)="onSave()">
                    </app-academic-period-form>
                </ng-container>
            </ng-container>
        </app-ui-modal>

        <!-- Suppression (outside app-ui-modal to prevent transform/overflow clipping) -->
        <app-ui-confirm-modal *ngIf="isModalOpen() && modalMode() === 'delete'" title="Supprimer la période"
            [message]="'Êtes-vous sûr de vouloir supprimer la période \'' + selectedItem()?.name + '\' ? Cette action est irréversible.'"
            (confirm)="confirmDelete()" (cancel)="closeModal()"></app-ui-confirm-modal>

        <app-ui-export-modal [isOpen]="showExportModal()" [isExporting]="isExporting()" (close)="closeExportModal()"
            (confirm)="confirmExport($event)">
        </app-ui-export-modal>
    </ng-container>
</app-ui-list-page>
