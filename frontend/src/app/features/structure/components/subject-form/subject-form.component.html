<div class="w-full h-[750px] flex flex-col overflow-hidden font-sans">
    <!-- Header -->
    <app-ui-form-header
        [title]="subject ? 'Modifier la Matière' : 'Nouvelle Matière'"
        description="Maintenez le catalogue des matières enseignées."
        (close)="onCancel()">
    </app-ui-form-header>

    <!-- Tabs & Content -->
    <div class="flex-1 min-h-0 flex flex-col relative w-full">
        <div class="px-6 pt-4">
            <app-ui-form-errors [errors]="formErrors"></app-ui-form-errors>
        </div>
        
        <app-ui-tabs [tabs]="tabs" [currentTab]="activeTab()" (tabChange)="activeTab.set($event)" layout="vertical">
            <form [formGroup]="form" (ngSubmit)="submit()" class="h-full overflow-y-auto pr-4 custom-scrollbar px-8 py-6">

                <!-- TAB 1: GENERAL -->
                <div *ngIf="activeTab() === 'general'" class="space-y-6 animate-in fade-in slide-in-from-right-4 duration-300">
                    <div class="flex items-center gap-3 mb-4 border-b border-slate-100 pb-3">
                      <div class="p-2 bg-indigo-50 rounded-lg text-indigo-600 font-bold uppercase tracking-widest text-[10px]">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                      </div>
                      <h3 class="text-lg font-bold text-slate-800 uppercase tracking-tight">Configuration Générale</h3>
                    </div>
                    <div class="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100/50">
                        <div class="grid grid-cols-1 gap-6">
                            <app-ui-input label="Nom de la matière" formControlName="name" [required]="true"
                                placeholder="ex: Mathématiques"></app-ui-input>

                            <app-ui-input label="Code" formControlName="code" [required]="true"
                                placeholder="ex: MATHS"></app-ui-input>

                            <div class="flex items-center gap-3 mt-2 p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="checkbox" formControlName="isOptional" 
                                           class="w-5 h-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 transition-all">
                                    <span class="text-sm font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Matière Optionnelle</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: LEVELS -->
                <div *ngIf="activeTab() === 'levels'" class="space-y-6 animate-in fade-in slide-in-from-right-4 duration-300">
                    <div class="flex items-center gap-3 mb-4 border-b border-slate-100 pb-3">
                      <div class="p-2 bg-emerald-50 rounded-lg text-emerald-600 font-bold uppercase tracking-widest text-[10px]">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                      </div>
                      <h3 class="text-lg font-bold text-slate-800 uppercase tracking-tight">Affectation Niveaux & Coeff.</h3>
                    </div>
                    <div *ngIf="isLoadingLevels()" class="py-12 flex flex-col items-center justify-center space-y-4">
                        <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-600 rounded-full animate-spin"></div>
                        <p class="text-slate-500 text-sm animate-pulse font-medium">Chargement des niveaux...</p>
                    </div>

                    <div *ngIf="!isLoadingLevels()" class="space-y-4">
                        <div class="flex justify-end sticky -top-6 z-20 bg-white/95 backdrop-blur-sm py-4 -mx-4 px-4 border-b border-slate-200/60 shadow-[0_4px_15px_-3px_rgba(0,0,0,0.05)] rounded-b-xl mb-4">
                            <button type="button" (click)="addAssignment()"
                                class="inline-flex items-center px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-md shadow-indigo-500/20 text-sm font-bold active:scale-95">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                Ajouter une affectation
                            </button>
                        </div>

                        <div class="overflow-x-auto custom-scrollbar border border-slate-200 rounded-2xl bg-white shadow-sm">
                            <table class="min-w-[950px] divide-y divide-slate-100">
                                <thead class="bg-slate-50/80">
                                    <tr>
                                        <th scope="col" class="px-4 py-4 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest min-w-[180px]">Niveau</th>
                                        <th scope="col" class="px-4 py-4 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest min-w-[180px]">Filière / Spécialité</th>
                                        <th scope="col" class="px-4 py-4 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest min-w-[180px]">Groupe / UE</th>
                                        <th scope="col" class="px-4 py-4 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest min-w-[100px]">Crédits</th>
                                        <th scope="col" class="px-4 py-4 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest min-w-[100px]">Coeff.</th>
                                        <th scope="col" class="px-4 py-4 text-left text-[10px] font-black text-slate-500 uppercase tracking-widest min-w-[120px]">Vol. Horaire</th>
                                        <th scope="col" class="px-4 py-4 text-right text-[10px] font-black text-slate-500 uppercase tracking-widest w-16"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100" formArrayName="levelSubjects">
                                    <tr *ngFor="let control of levelSubjectsArray.controls; let i = index" [formGroupName]="i" 
                                        class="hover:bg-indigo-50/30 transition-colors group">
                                        <td class="px-4 py-4">
                                            <select formControlName="levelId" 
                                                class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                                <option value="" disabled>Sélectionner</option>
                                                <option *ngFor="let level of allLevels()" [value]="level.id">{{ level.name }}</option>
                                            </select>
                                        </td>
                                        <td class="px-4 py-4">
                                            <ng-container *ngIf="control.get('availableOptions')?.value?.length > 0; else noOptions">
                                                <select formControlName="optionId" 
                                                    class="block w-full px-3 py-2 bg-white border border-indigo-200 rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                                    <option [ngValue]="null">Tronc Commun (Tous)</option>
                                                    <option *ngFor="let opt of control.get('availableOptions')?.value" [value]="opt.value">{{ opt.label }}</option>
                                                </select>
                                            </ng-container>
                                            <ng-template #noOptions>
                                                <span class="text-xs text-slate-400 italic">Tronc Commun</span>
                                            </ng-template>
                                        </td>
                                        <td class="px-4 py-4">
                                            <select formControlName="groupId" 
                                                class="block w-full px-3 py-2 bg-white border border-indigo-200 rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                                <option [ngValue]="null">Aucun groupe</option>
                                                <option *ngFor="let group of allGroups()" [value]="group.id">{{ group.name }}</option>
                                            </select>
                                        </td>
                                        <td class="px-4 py-4">
                                            <input type="number" formControlName="credits" min="0" step="1"
                                                class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                        </td>
                                        <td class="px-4 py-4">
                                            <input type="number" formControlName="coefficient" min="1" step="0.5"
                                                class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                        </td>
                                        <td class="px-4 py-4">
                                            <input type="number" formControlName="hourlyQuota" min="0"
                                                class="block w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                        </td>
                                        <td class="px-4 py-4 text-right">
                                            <button type="button" (click)="removeAssignment(i)"
                                                class="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div *ngIf="levelSubjectsArray.length === 0" class="p-12 text-center">
                                <div class="inline-flex p-4 rounded-full bg-slate-50 text-slate-300 mb-4">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                </div>
                                <p class="text-slate-400 font-medium italic">Aucune affectation configurée.</p>
                                <p class="text-[10px] text-slate-300 uppercase tracking-widest mt-2">Cliquez sur le bouton ci-dessus pour commencer</p>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </app-ui-tabs>
    </div>

    <!-- Footer Actions -->
    <app-ui-form-actions
        [isSubmitting]="isSubmitting"
        [disabled]="isSubmitting || form.invalid"
        (submit)="submit()"
        (cancel)="onCancel()">
    </app-ui-form-actions>
</div>
