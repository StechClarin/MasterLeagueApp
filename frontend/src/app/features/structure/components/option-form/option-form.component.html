<app-ui-form [formErrors]="formErrors" [title]="option ? 'Modifier la Filière' : 'Nouvelle Filière'" [formGroup]="form"
    [isLoading]="isSubmitting" [errorMessage]="errorMessage" [submitLabel]="option ? 'Modifier' : 'Créer'"
    description="Configurez les filières et spécialités de votre établissement." (submitForm)="submit()"
    (cancel)="onCancel()">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 mb-6">
        <!-- Nom -->
        <app-ui-input label="Nom de la filière" [control]="form.controls.name" [required]="true"
            placeholder="Ex: Génie Logiciel, Série C..." class="md:col-span-1"></app-ui-input>

        <!-- Code -->
        <app-ui-input label="Code" [control]="form.controls.code" [required]="true" placeholder="Ex: G-LOG"
            hint="Identifiant court" class="md:col-span-1"></app-ui-input>

        <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8 p-6 bg-slate-50 rounded-2xl border border-slate-100 shadow-inner">
            <!-- Cycle Anchor -->
            <app-ui-select label="Cycle Académique" [control]="form.controls.cycleId" [options]="cycles"
                placeholder="— Optionnel (Transversal) —"
                hint="Liez cette filière à un cycle pour la restreindre au lycée, université, etc.">
            </app-ui-select>

            <!-- Parent Option -->
            <app-ui-select label="Filière Parente" [control]="form.controls.parentId" [options]="parentOptions"
                placeholder="-- Aucune (Filière Racine) --"
                hint="Choisissez une filière parente pour créer une spécialité.">
            </app-ui-select>
        </div>
    </div>
</app-ui-form>
