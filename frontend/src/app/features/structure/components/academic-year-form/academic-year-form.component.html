<app-ui-form [title]="academicYear ? 'Modifier l\'Année' : 'Nouvelle Année Scolaire'" [formGroup]="form"
    [isLoading]="isSubmitting" [errorMessage]="errorMessage" [submitLabel]="academicYear ? 'Modifier' : 'Créer'"
    (submitForm)="submit()" (cancel)="onCancel()">

    <div class="grid grid-cols-1 gap-6 mb-6">
        <app-ui-input label="Nom de l'année" [control]="form.controls.name" [required]="true"
            placeholder="ex: 2024-2025"></app-ui-input>

        <div class="grid grid-cols-2 gap-4">
            <app-ui-input label="Date de début" type="date" [control]="form.controls.start_date"
                [required]="true"></app-ui-input>

            <app-ui-input label="Date de fin" type="date" [control]="form.controls.end_date"
                [required]="true"></app-ui-input>
        </div>

        <!-- Status Toggles -->
        <div class="flex gap-6 mt-4">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" formControlName="isActive" class="form-checkbox text-indigo-600 rounded">
                <span class="text-sm text-gray-700 font-medium">Définir comme Année Active</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" formControlName="isArchived" class="form-checkbox text-gray-600 rounded">
                <span class="text-sm text-gray-700 font-medium">Archivée</span>
            </label>
        </div>

    </div>

</app-ui-form>
