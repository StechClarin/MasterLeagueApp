<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
    <div class="grid grid-cols-1 gap-6">
        <!-- Nom -->
        <app-ui-input label="Nom de la salle" formControlName="name" placeholder="Ex: Salle 101, Laboratoire..."
            [required]="true" [readonly]="isReadOnly">
        </app-ui-input>

        <!-- Capacité -->
        <app-ui-input label="Capacité (Élèves)" type="number" formControlName="capacity" placeholder="30"
            [required]="true" [readonly]="isReadOnly">
        </app-ui-input>
    </div>

    <!-- Actions -->
    <div *ngIf="!isReadOnly" class="flex justify-end gap-3 pt-6 border-t border-gray-100">
        <button type="button" (click)="onCancel()"
            class="px-5 py-2.5 text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 font-medium text-sm transition-all">
            Annuler
        </button>
        <button type="submit" [disabled]="form.invalid || isSubmitting"
            class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-50 font-medium text-sm shadow-lg shadow-indigo-200 transition-all flex items-center">
            <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            {{ item ? 'Mettre à jour' : 'Créer la salle' }}
        </button>
    </div>
</form>
