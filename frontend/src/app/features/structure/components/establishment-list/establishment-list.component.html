<app-ui-list-page title="Gestion des Établissements" [isLoading]="isLoading()">

    <!-- Header Actions (Search + Add) -->
    <ng-container header-actions>
        <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher un établissement...">
            <button *ngIf="isSuperAdmin" (click)="openModal()"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center font-medium text-sm transform hover:-translate-y-0.5">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nouvel Établissement
            </button>
        </app-ui-toolbar>
    </ng-container>

    <!-- Filters & Secondary Actions (Import/Export) -->
    <ng-container filters>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-2">
                <button (click)="toggleFilters()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filtres
                    <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
                        [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>

            <!-- Import/Export buttons removed -->
        </div>

        <app-ui-filter-panel [isOpen]="isFiltersOpen()" [form]="filterForm" (reset)="resetFilters()">
            <div [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">

                <div class="space-y-1.5">
                    <label for="filter-city"
                        class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Ville</label>
                    <input type="text" id="filter-city" formControlName="city" placeholder="ex: Paris, Dakar..."
                        class="block w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-1.5">
                    <label for="filter-address"
                        class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Adresse</label>
                    <input type="text" id="filter-address" formControlName="address" placeholder="ex: 123 Rue..."
                        class="block w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-1.5">
                    <label for="filter-phone"
                        class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Téléphone</label>
                    <input type="text" id="filter-phone" formControlName="phone" placeholder="ex: 771234567"
                        class="block w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div class="space-y-1.5 md:col-span-3">
                    <label
                        class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1 mb-2">Statut</label>
                    <div class="flex items-center gap-6">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" formControlName="status_active"
                                class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Actif</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" formControlName="status_inactive"
                                class="w-4 h-4 text-red-500 border-gray-300 rounded focus:ring-red-500 cursor-pointer">
                            <span class="text-sm text-gray-700 group-hover:text-gray-900">Inactif</span>
                        </label>
                    </div>
                </div>
            </div>
        </app-ui-filter-panel>
    </ng-container>

    <ng-container table>
        <app-ui-table [columns]="tableColumns" [data]="(items$ | async) || []" [actionsTemplate]="actionsCell">
        </app-ui-table>
    </ng-container>

    <ng-container pagination>
        <div class="mt-2">
            <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
                [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()" (goTo)="goToPage($event)">
            </app-ui-pagination>
        </div>
    </ng-container>

</app-ui-list-page>

<ng-container modals>
    <app-ui-modal [isOpen]="isModalOpen() && modalMode() !== 'delete'" (close)="closeModal()">
        <ng-container [ngSwitch]="modalMode()">
            <!-- Create/Edit Mode -->
            <app-establishment-form *ngSwitchDefault [establishment]="selectedItem()" (success)="onSave()"
                (close)="closeModal()">
            </app-establishment-form>
        </ng-container>
    </app-ui-modal>

    <!-- Delete Mode (outside app-ui-modal to prevent transform/overflow clipping) -->
    <app-ui-confirm-modal *ngIf="isModalOpen() && modalMode() === 'delete'" title="Supprimer l'établissement ?"
        message="Êtes-vous sûr de vouloir supprimer cet établissement ?" (confirm)="confirmDelete()"
        (cancel)="closeModal()">
    </app-ui-confirm-modal>
</ng-container>

<ng-template #nameCell let-item>
    <div class="font-medium text-gray-900">{{ item.name }}</div>
</ng-template>

<ng-template #statusCell let-item>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
        [ngClass]="item.isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
        {{ item.isActive ? 'Actif' : 'Inactif' }}
    </span>
</ng-template>

<ng-template #actionsCell let-item>
    <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
        (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

        <!-- Trigger -->
        <button trigger
            class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
            [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>

        <!-- Menu Content -->
        <div menu class="flex items-center gap-1">
            <button (click)="openModal(item, 'edit')"
                class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
                title="Modifier">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </button>


            <div class="w-px h-6 bg-gray-200 mx-1"></div>

            <button (click)="toggleStatus(item); closeMenu()"
                class="p-2 rounded-full transition-colors relative group/btn"
                [title]="item.isActive ? 'Désactiver' : 'Activer'" [class.text-red-500]="item.isActive"
                [class.hover:bg-red-50]="item.isActive" [class.text-green-500]="!item.isActive"
                [class.hover:bg-green-50]="!item.isActive">
                <svg *ngIf="item.isActive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636">
                    </path>
                </svg>
                <svg *ngIf="!item.isActive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </button>

            <button (click)="openModal(item, 'delete')"
                class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
                title="Supprimer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </app-ui-dropdown>
</ng-template>
