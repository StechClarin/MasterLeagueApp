<app-ui-list-page title="Gestion des Options" [isLoading]="isLoading()">

    <!-- Header Actions (Search + Add) -->
    <ng-container header-actions>
        <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher une option / filière...">
            <button (click)="openModal()"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center font-medium text-sm transform hover:-translate-y-0.5">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nouvelle Option
            </button>
        </app-ui-toolbar>
    </ng-container>

    <!-- Filters & Secondary Actions -->
    <ng-container filters>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-2">
                <button (click)="toggleFilters()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filtres
                    <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
                        [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>
        </div>

        <app-ui-filter-panel [isOpen]="isFiltersOpen()" [form]="filterForm" (reset)="resetFilters()">
            <div [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <app-ui-select label="Cycle" formControlName="cycleId" [options]="cycles" placeholder="Filtrer par cycle"></app-ui-select>
                <app-ui-select label="Option Parente" formControlName="parentId" [options]="parentOptions" placeholder="Filtrer par option parente"></app-ui-select>
            </div>
        </app-ui-filter-panel>
    </ng-container>

    <!-- Table -->
    <ng-container table>
        <app-ui-table [columns]="tableColumns" [data]="(items$ | async) || []" [actionsTemplate]="actionsCell">
        </app-ui-table>
    </ng-container>

    <!-- Pagination -->
    <ng-container pagination>
        <div class="mt-2" *ngIf="showPagination">
            <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
                [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()" (goTo)="goToPage($event)">
            </app-ui-pagination>
        </div>
    </ng-container>

    <!-- Unified Modal -->
    <ng-container modals>
        <app-ui-modal [isOpen]="isModalOpen() && modalMode() !== 'delete'" (close)="closeModal()">
            <ng-container [ngSwitch]="modalMode()">

                <!-- Create/Edit Mode -->
                <app-option-form *ngSwitchDefault [option]="selectedItem()" (success)="onSave()"
                    [isReadOnly]="modalMode() === 'detail'" (cancel)="closeModal()">
                </app-option-form>

            </ng-container>
        </app-ui-modal>

        <!-- Delete Mode (outside app-ui-modal to prevent transform/overflow clipping) -->
        <app-ui-confirm-modal *ngIf="isModalOpen() && modalMode() === 'delete'" title="Supprimer l'option ?"
            message="Êtes-vous sûr de vouloir supprimer cette option ? Cette action est irréversible."
            (confirm)="confirmDelete()" (cancel)="closeModal()">
        </app-ui-confirm-modal>
    </ng-container>


</app-ui-list-page>

<!-- Custom Cell Templates -->
<ng-template #nameCell let-item>
    <div class="flex flex-col">
        <div class="flex items-center gap-2">
            <span class="font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">{{ item.name }}</span>
            <span *ngIf="!item.isActive" class="px-1.5 py-0.5 rounded text-[10px] bg-gray-100 text-gray-500 font-bold uppercase">Inactif</span>
        </div>
        <div *ngIf="item.parent" class="flex items-center gap-1.5 mt-0.5">
            <svg class="w-3 h-3 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
            <span class="text-[10px] text-slate-400 font-medium italic">
                Spécialité de {{ item.parent.name }}
            </span>
        </div>
    </div>
</ng-template>

<ng-template #parentCell let-item>
    <div *ngIf="item.cycle" class="flex items-center gap-2">
        <div class="px-2 py-1 rounded-lg bg-indigo-50 border border-indigo-100 text-[10px] font-bold text-indigo-700 uppercase tracking-wider">
            {{ item.cycle.name }}
        </div>
    </div>
    <div *ngIf="!item.cycle" class="flex items-center gap-2">
        <div class="px-2 py-1 rounded-lg bg-slate-100 border border-slate-200 text-[10px] font-bold text-slate-500 uppercase tracking-wider">
            Transversal
        </div>
    </div>
</ng-template>

<ng-template #actionsCell let-item>
    <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
        (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

        <button trigger
            class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
            [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>

        <div menu class="flex items-center gap-1">
            <!-- Toggle Status -->
            <button (click)="toggleStatus(item)"
                class="p-2 rounded-full transition-colors group/status"
                [class.text-green-500]="item.isActive"
                [class.text-gray-400]="!item.isActive"
                [title]="item.isActive ? 'Désactiver' : 'Activer'">
                <svg *ngIf="item.isActive" class="w-5 h-5 group-hover/status:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <svg *ngIf="!item.isActive" class="w-5 h-5 group-hover/status:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>

            <button (click)="openModal(item, 'detail')"
                class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                title="Détails">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>

            <button (click)="openModal(item, 'edit')"
                class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
                title="Modifier">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </button>

            <div class="w-px h-6 bg-gray-200 mx-1"></div>

            <button (click)="openModal(item, 'delete')"
                class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors"
                title="Supprimer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </app-ui-dropdown>
</ng-template>
