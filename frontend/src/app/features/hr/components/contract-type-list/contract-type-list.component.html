<app-ui-list-page 
    title="Types de Contrat"
    [isLoading]="isLoading()"
    [isEmpty]="!items$ || (items$ | async)?.length === 0">

    <ng-container header-actions>
        <app-ui-toolbar
            [searchControl]="searchControl"
            (add)="onAdd()">
        </app-ui-toolbar>
    </ng-container>

    <ng-container table>
        <app-ui-table
            [data]="items$ | async"
            [columns]="tableColumns"
            [sortField]="sortField"
            [sortDirection]="sortDirection"
            [actionsTemplate]="actionsTemplate"
            (sort)="onSort($event)">
        </app-ui-table>

        <ng-template #actionsTemplate let-item>
             <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
                (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">
                
                <!-- Trigger -->
                <button trigger
                    class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
                    [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
                    <span class="sr-only">Options</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <!-- Menu Content -->
                <div menu class="flex items-center gap-1">
                    <button (click)="onEdit(item)"
                        class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
                        title="Modifier">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </button>

                    <button (click)="onDelete(item)"
                        class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
                        title="Supprimer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </app-ui-dropdown>
        </ng-template>
    </ng-container>
    
    <ng-container pagination>
        <app-ui-pagination
            [currentPage]="currentPage()"
            [pageSize]="pageSize()"
            [totalCount]="totalCount()"
            [numPages]="numPages()"
            (prev)="prevPage()"
            (next)="nextPage()"
            (goTo)="goToPage($event)">
        </app-ui-pagination>
    </ng-container>

    <ng-container modals>
        <app-ui-modal 
            [isOpen]="isModalOpen()" 
            [title]="modalTitle"
            (close)="closeModal()">
            
            <app-contract-type-form
                *ngIf="isModalOpen() && modalMode() !== 'delete'"
                [data]="selectedItem()"
                (save)="onSave()"
                (cancel)="closeModal()">
            </app-contract-type-form>

             <!-- Mode Suppression (if needed, mimicking user-list structure, though currently handled by onSave for everything in base maybe?) 
                  BaseModalList has confirmDelete logic but usually needs a confirmation modal 
             -->
             <!-- Adding Confirm Modal if delete mode -->
             <div *ngIf="modalMode() === 'delete'" class="p-6">
                 <p class="text-gray-700 mb-6">Êtes-vous sûr de vouloir supprimer ce type de contrat ?</p>
                 <div class="flex justify-end gap-3">
                     <button (click)="closeModal()" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">Annuler</button>
                     <button (click)="confirmDelete()" class="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700">Supprimer</button>
                 </div>
             </div>

        </app-ui-modal>
    </ng-container>

</app-ui-list-page>
