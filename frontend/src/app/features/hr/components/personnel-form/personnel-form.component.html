<div class="p-4">
    <h2 class="text-xl font-bold mb-4">{{ isEditMode ? 'Modifier' : 'Ajouter' }} un personnel</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
        
        <!-- Section Utilisateur -->
        <h3 class="text-lg font-semibold border-b pb-1">Informations Personnelles</h3>
        <div formGroupName="user" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-ui-input label="Prénom" formControlName="first_name" placeholder="Prénom"></app-ui-input>
            <app-ui-input label="Nom" formControlName="last_name" placeholder="Nom"></app-ui-input>
            <app-ui-input label="Email" formControlName="email" type="email" placeholder="Email personnel"></app-ui-input>
        </div>

        <!-- Section Professionnelle -->
        <h3 class="text-lg font-semibold border-b pb-1 mt-2">Détails Professionnels</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-ui-input label="Matricule" formControlName="matricule" placeholder="Matricule RH"></app-ui-input>
            <app-ui-input label="Poste" formControlName="job_title" placeholder="Intitulé du poste"></app-ui-input>
            <app-ui-input label="Email Pro" formControlName="email_pro" type="email" placeholder="Email professionnel"></app-ui-input>
            <app-ui-input label="Téléphone" formControlName="phone_number" placeholder="Téléphone"></app-ui-input>
            
            <app-ui-select 
                label="Rôle" 
                formControlName="role" 
                [options]="roles$ | async" 
                bindLabel="name" 
                bindValue="id"
                placeholder="Sélectionner un rôle">
            </app-ui-select>

            <app-ui-select 
                label="Établissement" 
                formControlName="establishment" 
                [options]="establishments$ | async" 
                bindLabel="name" 
                bindValue="id"
                placeholder="Sélectionner un établissement">
            </app-ui-select>
        </div>

        <div class="flex justify-end gap-2 mt-4">
            <button type="button" (click)="cancel.emit()" class="px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Annuler</button>
            <button type="submit" [disabled]="isSubmitting" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50">
                <span *ngIf="isSubmitting" class="mr-2">
                  <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                </span>
                Enregistrer
            </button>
        </div>
    </form>
</div>
