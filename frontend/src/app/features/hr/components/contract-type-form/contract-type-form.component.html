<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col h-full px-6 py-8">
    
    <!-- Hero / Info Banner -->
    <div class="bg-indigo-50/50 rounded-xl p-5 mb-6 flex items-start gap-4 border border-indigo-100/50">
        <div class="p-2.5 bg-white rounded-lg shadow-sm text-indigo-600 border border-indigo-50">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <div>
            <h3 class="text-sm font-bold text-indigo-900 uppercase tracking-wide">Information du Contrat</h3>
            <p class="text-xs text-indigo-600/80 mt-1 leading-relaxed">Définissez les propriétés principales de ce type de contrat pour l'utiliser dans la gestion du personnel.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="space-y-6">
        
        <!-- Row 1: Code & Designation -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <div class="md:col-span-4">
                 <app-ui-input label="Code Unique" formControlName="code" placeholder="ex: CDI"></app-ui-input>
                 <p class="text-xs text-gray-400 mt-1.5 ml-1 flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Max 10 caractères
                 </p>
            </div>
            <div class="md:col-span-8">
                 <app-ui-input label="Désignation Complète" formControlName="designation" placeholder="ex: Contrat à Durée Indéterminée"></app-ui-input>
            </div>
        </div>

        <!-- Row 2: Description with Fake Toolbar -->
        <div class="space-y-2">
            <div class="flex items-center justify-between px-1">
                <label class="block text-sm font-semibold text-gray-700">Description & Notes</label>
                <!-- Fake Toolbar -->
                <div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1 border border-gray-200">
                     <button type="button" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-white rounded transition-all"><span class="font-bold font-serif text-xs">B</span></button>
                     <button type="button" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-white rounded transition-all"><span class="italic font-serif text-xs">I</span></button>
                     <div class="w-px h-3 bg-gray-300 mx-1"></div>
                     <button type="button" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-white rounded transition-all"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg></button>
                </div>
            </div>
            
            <div class="relative group">
                <textarea 
                    formControlName="description" 
                    rows="4" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all resize-none text-sm placeholder:text-gray-400 bg-white group-hover:border-gray-300"
                    placeholder="Saisissez une description détaillée...">
                </textarea>
                <div class="absolute bottom-3 right-3 pointer-events-none text-gray-300">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions Footer -->
    <div class="flex items-center justify-end gap-3 pt-6 border-t border-gray-100 mt-8">
        <button type="button" (click)="cancel.emit()" 
            class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50 hover:text-gray-900 transition-colors focus:ring-4 focus:ring-gray-100">
            Annuler
        </button>
        <button type="submit" [disabled]="isSubmitting || form.invalid" 
            class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 active:bg-indigo-800 transition-all shadow-lg shadow-indigo-500/20 focus:ring-4 focus:ring-indigo-500/30 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 group">
            <div *ngIf="isSubmitting" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            <span>{{ isSubmitting ? 'Enregistrement...' : 'Enregistrer' }}</span>
            <svg *ngIf="!isSubmitting" class="w-4 h-4 opacity-50 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
    </div>
</form>
