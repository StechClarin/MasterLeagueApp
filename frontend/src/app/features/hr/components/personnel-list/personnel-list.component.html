<app-ui-list-page
  title="Gestion du Personnel"
  [isLoading]="isLoading()"
  [isEmpty]="!hasData() && !isLoading()"
  (refresh)="refresh()"
  (openAddModal)="openAddModal()"
  (openExportModal)="openExportModal()" 
>
  <ng-container header-actions>
      <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher un personnel...">
          <button (click)="openAddModal()"
              class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center font-medium text-sm transform hover:-translate-y-0.5">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              Nouveau Personnel
          </button>
      </app-ui-toolbar>
  </ng-container>

  <ng-container filters>
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div class="flex items-center gap-2">
              <button (click)="toggleFilters()"
                  class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                  <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24"
                      stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                  </svg>
                  Filtres
                  <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
                      [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
              </button>
          </div>

          <div class="flex items-center gap-3">
              <button (click)="onDownloadTemplate()"
                  class="px-4 py-2.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all flex items-center justify-center font-medium text-sm group border border-indigo-100">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                  Télécharger la trame
              </button>

              <button (click)="onImport()"
                  class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-green-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                  <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-green-600" fill="none" viewBox="0 0 24 24"
                      stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                  </svg>
                  Importer
              </button>

              <button (click)="onExport()"
                  class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-blue-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                  <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24"
                      stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                  Exporter
              </button>
          </div>
      </div>

      <app-ui-filter-panel [isOpen]="isFiltersOpen()" [form]="filterForm" (reset)="resetFilters()">
      <div [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
           <!-- Job Title -->
           <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Intitulé du poste</label>
              <input type="text" formControlName="jobTitle" (input)="dispatchFilters()"
                  class="block w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-gray-400"
                  placeholder="Ex: Professeur">
           </div>

           <!-- Contract Type -->
           <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Type de contrat</label>
              <div class="relative">
                <select formControlName="contractType" (change)="dispatchFilters()"
                  class="block w-full pl-4 pr-10 py-2.5 border border-gray-200 rounded-xl text-sm appearance-none bg-no-repeat bg-right focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer bg-white">
                  <option [ngValue]="null">Tous les contrats</option>
                  <option *ngFor="let type of contractTypes$ | async" [value]="type.id">{{ type.designation }}</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
           </div>

           <!-- Role -->
           <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Rôle</label>
              <div class="relative">
                <select formControlName="role" (change)="dispatchFilters()"
                  class="block w-full pl-4 pr-10 py-2.5 border border-gray-200 rounded-xl text-sm appearance-none bg-no-repeat bg-right focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer bg-white">
                  <option [ngValue]="null">Tous les rôles</option>
                  <option *ngFor="let role of roles$ | async" [value]="role.id">{{ role.name }}</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
           </div>
      </div>
    </app-ui-filter-panel>
  </ng-container>

  <ng-container table>
    <app-ui-table
      [columns]="tableColumns"
      [data]="items$ | async"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      [actionsTemplate]="actionsTemplate"
      (sort)="onSort($event)"
      (edit)="openEditModal($event)"
      (delete)="openDeleteModal($event)"
    ></app-ui-table>

    <ng-template #userCell let-item>
      <div class="flex items-center">
        <div class="h-11 w-11 flex-shrink-0">
          <app-ui-avatar [name]="item.user.username" [photoUrl]="item.user.photo"></app-ui-avatar>
        </div>
        <div class="ml-4">
          <div class="text-sm font-semibold text-gray-900">{{ item.user.firstName }} {{ item.user.lastName }}</div>
          <div class="text-sm text-gray-500">{{ item.user.email }}</div>
        </div>
      </div>
    </ng-template>

    <ng-template #actionsTemplate let-item>
         <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
            (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">
            
            <button trigger
                class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
                [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}"
                title="Options">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <div menu class="flex items-center gap-1">
                <button (click)="openViewModal(item)"
                    class="p-2 rounded-full text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors relative group/btn"
                    title="Détails">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                </button>

                <button (click)="openEditModal(item)"
                    class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
                    title="Modifier">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </button>

                <button (click)="openDeleteModal(item)"
                    class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
                    title="Supprimer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>

                <div class="w-px h-6 bg-gray-200 mx-1"></div>

                <button (click)="toggleStatus(item)"
                    class="p-2 rounded-full transition-colors relative group/btn"
                    [ngClass]="item.isActive ? 'text-green-500 hover:bg-green-50 hover:text-green-600' : 'text-gray-400 hover:bg-gray-100 hover:text-gray-600'"
                    [title]="item.isActive ? 'Désactiver le compte' : 'Activer le compte'">
                    <svg *ngIf="item.isActive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg *ngIf="!item.isActive" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                    </svg>
                </button>
            </div>
        </app-ui-dropdown>
    </ng-template>
  </ng-container>

  <ng-container pagination>
    <app-ui-pagination
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalCount]="totalCount()"
      [numPages]="numPages()"
      (prev)="prevPage()"
      (next)="nextPage()"
    ></app-ui-pagination>
  </ng-container>
</app-ui-list-page>

<app-ui-modal [isOpen]="isModalOpen() && modalMode() !== 'delete'" (close)="closeModal()">
  <ng-container [ngSwitch]="modalMode()">
    <app-personnel-detail
      *ngSwitchCase="'view'"
      [data]="selectedItem()"
      (close)="closeModal()"
    ></app-personnel-detail>

    <app-personnel-form
      *ngSwitchDefault
      [data]="selectedItem()"
      (cancel)="closeModal()"
      (success)="onSaveSuccess()"
    ></app-personnel-form>
  </ng-container>
</app-ui-modal>

<!-- Delete Mode (outside app-ui-modal to prevent transform/overflow clipping) -->
<app-ui-confirm-modal
  *ngIf="isModalOpen() && modalMode() === 'delete'"
  title="Supprimer le personnel"
  [message]="'Êtes-vous sûr de vouloir supprimer ' + ((selectedItem()?.user?.firstName || '') + ' ' + (selectedItem()?.user?.lastName || '')) + ' ?'"
  (confirm)="confirmDelete()"
  (cancel)="closeModal()"
></app-ui-confirm-modal>

<app-ui-export-modal
    [isOpen]="showExportModal()"
    [isExporting]="isExporting()"
    (close)="closeExportModal()"
    (confirm)="confirmExport($event)"
></app-ui-export-modal>
