query GetAllTeachers($search: String, $page: Int, $pageSize: Int) {
  teachers(search: $search, page: $page, pageSize: $pageSize) {
    items {
      id
      specialty
      hoursPerWeek
      user {
        firstName
        lastName
      }
      matricule
    }
    totalCount
    numPages
    currentPage
  }
}
