query GetDashboardData {
  dashboardData {
    totalStudents
    totalStaff
    totalClassrooms
    totalActiveEvaluations
    averageGrade
    totalRevenue
    totalPending
    gradeEvolution {
      label
      value
    }
    studentDistribution {
      category
      count
    }
    revenueEvolution {
      label
      value
    }
    paymentMethodsDistribution {
      category
      count
    }
    topStudents {
      studentName
      averageGrade
      matricule
    }
    recoveryRate
    totalTeachers
    studentGenderDistribution {
      category
      count
    }
    recentPayments {
      id
      studentName
      amount
      paymentMethod
      paymentDate
    }
    recentEnrollments {
      id
      studentName
      classroomName
      enrollmentDate
      status
    }
    subjectGradesDistribution {
      category
      count
    }
    invoiceStatusDistribution {
      category
      count
    }
    staffContractDistribution {
      category
      count
    }
    enrollmentEvolution {
      label
      value
    }
  }
}
