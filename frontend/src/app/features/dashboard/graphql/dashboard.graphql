query GetDashboardData {
  dashboardData {
    totalStudents
    totalStaff
    totalClassrooms
    totalActiveEvaluations
    averageGrade
    totalRevenue
    totalPending
    gradeEvolution {
      label
      value
    }
    studentDistribution {
      category
      count
    }
    revenueEvolution {
      label
      value
    }
    paymentMethodsDistribution {
      category
      count
    }
    topStudents {
      studentName
      averageGrade
      matricule
    }
  }
}
