query GetDashboardData {
  dashboardData {
    activeTaxis
    totalTaxis
    rentalRate
    totalRevenue
    storeOrders
    pendingMaintenance
    
    # Métriques détaillées du Parc
    totalVehicles
    vehiclesToRent
    vehiclesRented
    providerVehicles
    companyTaxis
    totalDrivers
    brokenVehicles
    activeVehicles

    # Nouvelles métriques ultra-riches
    fuelConsumption
    fuelCosts
    clientSatisfaction
    activeAlertsCount
    upcomingMaintenances
    availableVehiclesCount
    utilizationRate

    revenueEvolution {
      label
      value
    }
    fleetStatusDistribution {
      category
      count
    }
    serviceRevenueDistribution {
      category
      count
    }
    topPerformers {
      driverName
      tripsCount
      revenue
      vehiclePlate
    }
  }
}
