query GetDashboardData {
  dashboardData {
    activeTaxis
    totalTaxis
    rentalRate
    totalRevenue
    storeOrders
    pendingMaintenance
    revenueEvolution {
      label
      value
    }
    fleetStatusDistribution {
      category
      count
    }
    serviceRevenueDistribution {
      category
      count
    }
    topPerformers {
      driverName
      tripsCount
      revenue
      vehiclePlate
    }
  }
}
