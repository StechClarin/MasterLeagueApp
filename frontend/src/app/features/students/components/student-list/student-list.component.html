<app-ui-list-page title="Élèves" description="Gérez les dossiers élèves, inscriptions et suivis."
  [isLoading]="isLoading()" [isEmpty]="!isLoading() && (!items$ || (items$ | async)?.length === 0)">

  <!-- Header Actions -->
  <ng-container header-actions>
    <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher (Nom, Matricule)...">
      <button (click)="openModal()"
        class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 transition-all shadow-lg flex items-center justify-center font-medium text-sm">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Nouvel Élève
      </button>
    </app-ui-toolbar>
  </ng-container>

  <!-- Filters -->
  <ng-container filters>
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
      <div class="flex items-center gap-2">
        <button (click)="toggleFilters()"
          class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
          <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
          Filtres Avancés
          <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
            [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>

      <div class="flex items-center gap-3">
        <button (click)="onDownloadTemplate()"
          class="px-4 py-2.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all flex items-center justify-center font-medium text-sm group border border-indigo-100">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Télécharger la trame
        </button>

        <button (click)="onImport()"
          class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-green-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
          <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-green-600" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          Importer
        </button>

        <button (click)="openExportModal()"
          class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-blue-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
          <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Exporter
        </button>
      </div>
    </div>

    <app-ui-filter-panel [isOpen]="isFiltersOpen()" [form]="filterForm" (reset)="resetFilters()">
      <div [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
        <!-- Filter: Class -->
        <div class="space-y-1.5">
          <label for="filter-class" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Classe</label>
          <div class="relative">
             <select id="filter-class" formControlName="classroomId"
              class="block w-full pl-4 pr-10 py-2.5 border border-gray-200 rounded-xl text-sm appearance-none bg-no-repeat bg-right focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all cursor-pointer">
              <option [ngValue]="null">Toutes les classes</option>
              <option *ngFor="let c of classrooms$ | async" [value]="c?.id">{{ c?.name }}</option>
            </select>
          </div>
        </div>

        <!-- Filter: Parent Phone -->
        <div class="space-y-1.5">
          <label for="filter-phone" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Téléphone Parent</label>
          <input type="text" id="filter-phone" formControlName="parentPhone" placeholder="ex: 770000000"
            class="block w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
        </div>
      </div>
    </app-ui-filter-panel>
  </ng-container>
  <ng-container table>
    <app-ui-table [data]="(items$ | async) || []" [columns]="tableColumns" [actionsTemplate]="actionsCell">
    </app-ui-table>

    <!-- Templates -->
    <ng-template #studentCell let-item>
      <div class="flex items-center">
        <div class="h-10 w-10 flex-shrink-0">
             <app-ui-avatar [name]="item.firstName + ' ' + item.lastName" [photoUrl]="item.photo"></app-ui-avatar>
        </div>
        <div class="ml-4">
          <div class="text-sm font-semibold text-gray-900">{{ item.firstName }} {{ item.lastName }}</div>
          <div class="text-xs text-gray-500">{{ item.dateOfBirth | date:'dd/MM/yyyy' }} ({{ item.placeOfBirth }})</div>
        </div>
      </div>
    </ng-template>

    <ng-template #classCell let-item>
        <ng-container *ngIf="getCurrentEnrollment(item) as enrollment; else noClass">
            <span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-50 text-green-700 border border-green-200">
                {{ enrollment.classroom.name }}
            </span>
            <div class="text-xs text-gray-400 mt-1">{{ enrollment.academicYear.name }}</div>
        </ng-container>
        <ng-template #noClass>
            <span class="text-gray-400 text-xs italic">Non inscrit</span>
        </ng-template>
    </ng-template>

    <ng-template #actionsCell let-item>
      <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
        (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

        <!-- Trigger -->
        <button trigger
          class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
          [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
          <span class="sr-only">Options</span>
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
            </path>
          </svg>
        </button>

        <!-- Menu Content (Horizontal Icons) -->
        <div menu class="flex items-center gap-1">

          <button (click)="onEdit(item)"
            class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
            title="Modifier">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
              </path>
            </svg>
          </button>

          <button (click)="onDetails(item)"
            class="p-2 rounded-full text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors relative group/btn"
            title="Détails">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
              </path>
            </svg>
          </button>

          <div class="w-px h-6 bg-gray-200 mx-1"></div>

          <button (click)="onDelete(item)"
            class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
            title="Supprimer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
              </path>
            </svg>
          </button>
        </div>
      </app-ui-dropdown>
    </ng-template>
  </ng-container>

  <!-- Pagination -->
  <ng-container pagination>
    <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
      [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()" (goTo)="goToPage($event)"></app-ui-pagination>
  </ng-container>

  <!-- Modals -->
  <ng-container modals>
    <app-ui-modal [isOpen]="isModalOpen()" (close)="closeModal()" maxWidth="sm:max-w-4xl">
      <ng-container [ngSwitch]="modalMode()">
        <app-ui-confirm-modal *ngSwitchCase="'delete'" 
           title="Supprimer l'élève ?" 
           [message]="'Attention, cela supprimera aussi tout son historique scolaire.'"
           (confirm)="confirmDelete()" (cancel)="closeModal()"></app-ui-confirm-modal>
        
        <app-student-detail *ngSwitchCase="'detail'"
           [data]="selectedItem()"
           (closeParams)="closeModal()">
        </app-student-detail>

        <app-student-form *ngSwitchDefault
             [data]="selectedItem()" 
             (cancel)="closeModal()"
             (success)="onSave()">
        </app-student-form>
      </ng-container>
    </app-ui-modal>

    <!-- Export Modal -->
    <app-ui-export-modal [isOpen]="showExportModal()" [isExporting]="isExporting()" (close)="closeExportModal()"
      (confirm)="confirmExport($event)">
    </app-ui-export-modal>
  </ng-container>

</app-ui-list-page>
