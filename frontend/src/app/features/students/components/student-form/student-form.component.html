<div class="h-full flex flex-col bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden">
  <!-- Header -->
  <app-ui-form-header
    [title]="(isEditMode ? 'Modifier' : 'Ajouter') + ' un élève'"
    description="Gérez les inscriptions et données élèves."
    (close)="close()">
  </app-ui-form-header>

  <div *ngIf="errorMessage" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative flex-shrink-0 mx-6 mt-4" role="alert">
    <strong class="font-bold">Erreur!</strong>
    <span class="block sm:inline"> {{ errorMessage }}</span>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-hidden min-h-0 flex flex-col relative bg-white">
    <app-ui-tabs [tabs]="tabs" [currentTab]="currentTab()" (tabChange)="currentTab.set($event)" class="flex flex-col h-full">
    
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6 h-[550px] min-h-[550px]" [formGroup]="form">

        <!-- TAB 1: IDENTITÉ -->
        <div *ngIf="currentTab() === 'identity'" class="space-y-4 pt-2">
            <!-- Photo Section -->
            <div class="flex flex-col items-center mb-6">
                <app-ui-media-input
                    formControlName="photo"
                    shape="circle"
                    size="md"
                    label="Photo de l'élève"
                ></app-ui-media-input>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <app-ui-input label="Nom" formControlName="last_name" placeholder="Nom de famille"></app-ui-input>
                <app-ui-input label="Prénom" formControlName="first_name" placeholder="Prénom(s)"></app-ui-input>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <app-ui-select label="Sexe" formControlName="gender" [options]="genders"></app-ui-select>
                <app-ui-input type="date" label="Date de naissance" formControlName="date_of_birth"></app-ui-input>
            </div>

            <app-ui-input label="Lieu de naissance" formControlName="place_of_birth"></app-ui-input>
            <app-ui-input label="Adresse" formControlName="address"></app-ui-input>
            
            <div class="p-2 bg-yellow-50 text-yellow-700 text-sm rounded border border-yellow-200">
                <i class="fas fa-info-circle"></i> Le matricule sera généré automatiquement.
            </div>
        </div>

        <!-- TAB 2: SCOLARITÉ -->
        <div *ngIf="currentTab() === 'cursus'" class="space-y-4 pt-2" formGroupName="enrollment_input">
            <app-ui-select label="Année Académique" formControlName="academic_year_id" [options]="academicYearsOptions()"></app-ui-select>
            
            <app-ui-select label="Classe" formControlName="classroom_id" [options]="classroomsOptions()"></app-ui-select>

            <div class="flex items-center space-x-2 mt-4">
                <input type="checkbox" formControlName="is_repeater" id="repeater" class="rounded text-indigo-600 focus:ring-indigo-500">
                <label for="repeater" class="text-sm text-gray-700">Cet élève est un redoublant</label>
            </div>
        </div>

        <!-- TAB 3: FAMILLE -->
        <div *ngIf="currentTab() === 'family'" class="space-y-6 pt-2" [formArrayName]="'parents_input'">
            <div class="flex justify-end space-x-2 sticky top-0 bg-white z-10 py-2 border-b border-gray-50">
                <button type="button" (click)="addParent('FATHER')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3 py-1.5 rounded-lg border border-indigo-100 transition-colors">+ Père</button>
                <button type="button" (click)="addParent('MOTHER')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3 py-1.5 rounded-lg border border-indigo-100 transition-colors">+ Mère</button>
                <button type="button" (click)="addParent('TUTOR')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3 py-1.5 rounded-lg border border-indigo-100 transition-colors">+ Tuteur</button>
            </div>

            <div *ngFor="let parent of parentsArray.controls; let i=index" [formGroupName]="i" class="border border-gray-200 rounded-xl p-5 relative bg-gray-50/50 hover:bg-white hover:shadow-md transition-all group">
                <button type="button" (click)="removeParent(i)" class="absolute top-3 right-3 p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors opacity-0 group-hover:opacity-100" title="Supprimer ce parent">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                </button>
            
                <div class="flex items-center gap-2 mb-4">
                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">{{ parent.get('role')?.value }}</span>
                </div>
            
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <app-ui-input label="Prénom" formControlName="first_name" class="bg-white"></app-ui-input>
                    <app-ui-input label="Nom" formControlName="last_name" class="bg-white"></app-ui-input>
                </div>
            
                <div class="grid grid-cols-2 gap-4">
                    <app-ui-input label="Téléphone" formControlName="phone_number" class="bg-white" placeholder="ex: 77 000 00 00"></app-ui-input>
                    <app-ui-input label="Profession" formControlName="profession" class="bg-white"></app-ui-input>
                </div>
            </div>
            
            <div *ngIf="parentsArray.length === 0" class="text-center py-10 border-2 border-dashed border-gray-200 rounded-xl">
                <p class="text-gray-400 italic">Aucun parent ajouté.</p>
                <p class="text-xs text-gray-400 mt-1">Utilisez les boutons ci-dessus pour ajouter un ou plusieurs parents.</p>
            </div>
        </div>

        <!-- TAB 4: SANTÉ -->
        <div *ngIf="currentTab() === 'health'" class="space-y-4 pt-2" formGroupName="health_input">
            <div class="grid grid-cols-2 gap-4">
                <app-ui-select label="Groupe Sanguin" formControlName="blood_group" [options]="bloodGroups"></app-ui-select>
            </div>
            
            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-700">Allergies</label>
                <textarea formControlName="allergies" rows="2" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 sm:text-sm p-3"></textarea>
            </div>

            <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-700">Conditions Médicales</label>
                <textarea formControlName="medical_conditions" rows="2" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 sm:text-sm p-3"></textarea>
            </div>

            <div class="border-t border-gray-100 pt-5 mt-4">
                <h4 class="text-sm font-bold text-gray-900 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M12 2a10 10 0 00-10 10c0 5.523 4.477 10 10 10s10-4.477 10-10A10 10 0 0012 2zm0 14a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0-10v5"></path></svg>
                    Contact d'urgence
                </h4>
                <div class="grid grid-cols-2 gap-4">
                    <app-ui-input label="Nom du contact" formControlName="emergency_contact_name"></app-ui-input>
                    <app-ui-input label="Téléphone" formControlName="emergency_contact_phone"></app-ui-input>
                </div>
            </div>
        </div>

        </div>
    </app-ui-tabs>
  </div>

  <!-- Footer -->
  <app-ui-form-actions
      [isSubmitting]="isSubmitting"
      [disabled]="isSubmitting"
      submitLabel="Enregistrer"
      cancelLabel="Annuler"
      (submit)="submit()"
      (cancel)="close()">
  </app-ui-form-actions>
</div>
