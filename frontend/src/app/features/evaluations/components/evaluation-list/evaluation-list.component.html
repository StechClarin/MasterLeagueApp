<app-ui-list-page title="Dossiers d'Épreuve" description="Gérez les examens, évaluations et saisies de notes."
    [isLoading]="isLoading()">
    <!-- Header Actions -->
    <ng-container header-actions>
        <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher une épreuve...">
            <button (click)="openModal()"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 focus:ring-4 focus:ring-indigo-500/30 transition-all shadow-lg flex items-center justify-center font-medium text-sm">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nouvelle Épreuve
            </button>
        </app-ui-toolbar>
    </ng-container>

    <!-- Filters -->
    <ng-container filters>
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
            <div class="flex items-center gap-2">
                <button (click)="toggleFilters()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-gray-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                    <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-gray-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filtres Avancés
                    <svg class="w-4 h-4 ml-2 text-gray-400 transform transition-transform duration-200"
                        [class.rotate-180]="isFiltersOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
            </div>

            <div class="flex items-center gap-3">
                <button (click)="refresh()"
                    class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-indigo-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group"
                    title="Actualiser">
                    <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-600" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <app-ui-filter-panel [isOpen]="isFiltersOpen()" [form]="filterForm" (close)="toggleFilters()"
            (reset)="resetFilters()">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <app-ui-select label="Période" [formControl]="$any(filterForm.get('period'))"
                    [options]="(periods$ | async) || []" bindLabel="name" bindValue="id"></app-ui-select>

                <app-ui-select label="Niveau" [formControl]="$any(filterForm.get('level'))"
                    [options]="(levels$ | async) || []" bindLabel="name" bindValue="id"></app-ui-select>

                <app-ui-select label="Classe" [formControl]="$any(filterForm.get('classroom'))"
                    [options]="(classrooms$ | async) || []" bindLabel="name" bindValue="id"></app-ui-select>

                <app-ui-select label="Matière" [formControl]="$any(filterForm.get('subject'))"
                    [options]="(subjects$ | async) || []" bindLabel="name" bindValue="id"></app-ui-select>

                <app-ui-select label="Statut" [formControl]="$any(filterForm.get('status'))" [options]="[
                    { value: null, label: 'Tous' },
                    { value: 'DRAFT', label: 'Brouillon' },
                    { value: 'IN_PROGRESS', label: 'Lancé' },
                    { value: 'COMPLETED', label: 'Clôturé' },
                    { value: 'CANCELLED', label: 'Annulé' }
                ]" bindLabel="label" bindValue="value"></app-ui-select>
            </div>
        </app-ui-filter-panel>
    </ng-container>

    <ng-container table>
        <app-ui-table [columns]="tableColumns" [data]="(items$ | async) || []" [actionsTemplate]="actionsCell">
        </app-ui-table>

        <!-- Cell Templates -->
        <ng-template #titleCell let-item>
            <div class="font-bold text-gray-900 dark:text-white">{{ item.title }}</div>
        </ng-template>

        <ng-template #evalTypeCell let-item>
            <div class="text-sm text-gray-700 dark:text-gray-300 font-medium">
                {{ item.evaluationType?.name }}
            </div>
        </ng-template>

        <ng-template #periodCell let-item>
            <div class="text-sm text-gray-500">
                {{ item.academicPeriod?.name }}
            </div>
        </ng-template>

        <ng-template #scopeCell let-item>
            <div class="flex flex-col gap-1">
                <span
                    class="inline-flex w-fit text-[10px] px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-100 rounded-md uppercase font-bold tracking-wider">
                    {{ item.scope === 'CLASS' ? 'Par Classe' : item.scope === 'LEVEL' ? 'Par Niveau' :
                    'Établissement' }}
                </span>
            </div>
        </ng-template>

        <ng-template #statusCell let-item>
            <span [ngSwitch]="item.status"
                class="px-2 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                <span *ngSwitchCase="'DRAFT'" class="bg-gray-100 text-gray-600">Brouillon</span>
                <span *ngSwitchCase="'IN_PROGRESS'" class="bg-blue-100 text-blue-700">Lancé</span>
                <span *ngSwitchCase="'COMPLETED'" class="bg-emerald-100 text-emerald-700">Clôturé</span>
                <span *ngSwitchCase="'CANCELLED'" class="bg-red-100 text-red-700">Annulé</span>
                <span *ngSwitchCase="'LOCKED'" class="bg-purple-100 text-purple-700">Verrouillé</span>
            </span>
        </ng-template>

        <ng-template #actionsCell let-item>
            <app-ui-dropdown [isOpen]="activeMenuId() === item.id" direction="horizontal"
                (isOpenChange)="$event ? toggleMenu(item.id) : closeMenu()">

                <!-- Trigger -->
                <button trigger
                    class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
                    [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === item.id}">
                    <span class="sr-only">Options</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16">
                        </path>
                    </svg>
                </button>

                <!-- Menu Content (Horizontal Icons) -->
                <div menu class="flex items-center gap-1">

                    <!-- Edit -->
                    <button (click)="onEdit(item)"
                        class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
                        title="Modifier">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                            </path>
                        </svg>
                    </button>

                    <!-- Grades (Only if not DRAFT) -->
                    <button *ngIf="item.status !== 'DRAFT'" (click)="goToGrades(item)"
                        class="p-2 rounded-full text-blue-500 hover:bg-blue-50 hover:text-blue-700 transition-colors relative group/btn"
                        title="Saisir les notes">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
                            </path>
                        </svg>
                    </button>

                    <!-- Lancer (DRAFT -> IN_PROGRESS) -->
                    <button *ngIf="item.status === 'DRAFT'" (click)="onChangeStatus(item, 'IN_PROGRESS')"
                        class="p-2 rounded-full text-blue-500 hover:bg-blue-50 hover:text-blue-600 transition-colors relative group/btn"
                        title="Lancer l'évaluation">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>

                    <!-- Clôturer (IN_PROGRESS -> COMPLETED) -->
                    <button *ngIf="item.status === 'IN_PROGRESS'" (click)="onChangeStatus(item, 'COMPLETED')"
                        class="p-2 rounded-full text-emerald-500 hover:bg-emerald-50 hover:text-emerald-600 transition-colors relative group/btn"
                        title="Clôturer l'évaluation">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>

                    <!-- Annuler (IN_PROGRESS -> CANCELLED) -->
                    <button *ngIf="item.status === 'IN_PROGRESS'" (click)="onChangeStatus(item, 'CANCELLED')"
                        class="p-2 rounded-full text-amber-500 hover:bg-amber-50 hover:text-amber-600 transition-colors relative group/btn"
                        title="Annuler l'évaluation">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>

                    <!-- Export Planning -->
                    <button (click)="exportPlanning(item)"
                        class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-600 transition-colors relative group/btn"
                        title="Exporter le planning en PDF">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                    </button>

                    <!-- Details -->
                    <button (click)="onDetails(item)"
                        class="p-2 rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors relative group/btn"
                        title="Détails">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                            </path>
                        </svg>
                    </button>

                    <div class="w-px h-6 bg-gray-200 mx-1"></div>

                    <!-- Delete -->
                    <button (click)="onDelete(item)"
                        class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
                        title="Supprimer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                    </button>
                </div>
            </app-ui-dropdown>
        </ng-template>
    </ng-container>

    <!-- Pagination -->
    <ng-container pagination>
        <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
            [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()" (goTo)="goToPage($event)">
        </app-ui-pagination>
    </ng-container>

    <!-- Modals -->
    <ng-container modals>
        <app-ui-modal [isOpen]="isModalOpen()" (close)="closeModal()" maxWidth="sm:max-w-4xl w-full">
            <ng-container [ngSwitch]="modalMode()">
                <!-- Suppression -->
                <app-ui-confirm-modal *ngSwitchCase="'delete'" title="Supprimer l'évaluation"
                    [message]="'Êtes-vous sûr de vouloir supprimer l\'évaluation ' + (selectedItem()?.title || '') + ' ? Toutes les notes associées seront supprimées.'"
                    (confirm)="confirmDelete()" (cancel)="closeModal()"></app-ui-confirm-modal>

                <!-- Formulaire -->
                <app-evaluation-form *ngSwitchDefault [item]="selectedItem()" [isReadOnly]="modalMode() === 'detail'"
                    (cancel)="closeModal()" (success)="onSave()"></app-evaluation-form>

                <app-ui-confirm-modal *ngSwitchCase="'change-status'"
                    [title]="'Changer le statut : ' + (selectedItem()?.title || '')" [message]="statusConfirmMessage"
                    confirmLabel="Confirmer" type="info" (confirm)="confirmStatusChange()"
                    (cancel)="closeModal()"></app-ui-confirm-modal>
            </ng-container>
        </app-ui-modal>
    </ng-container>

</app-ui-list-page>
<!-- end -->
