# ==============================================================================
# FRAGMENTS
# ==============================================================================

fragment EvaluationTypeFields on EvaluationTypeType {
  id
  name
  code
  weight
  description
  isActive
}

fragment EvaluationSessionFields on EvaluationSessionType {
  id
  title
  status
  scope
  evaluationType {
    id
    name
    code
    weight
  }
  academicPeriod {
    id
    name
  }
  subjects {
    ...EvaluationSubjectFields
  }
}

fragment EvaluationSubjectFields on EvaluationSubjectType {
  id
  maxScore
  coefficient
  levelCoefficients {
    levelId
    coefficient
  }
  subjectFile
  subject {
    id
    name
  }
  levels {
    id
    name
  }
  plannings {
    ...EvaluationPlanningFields
  }
}

fragment EvaluationPlanningFields on EvaluationPlanningType {
  id
  date
  startTime
  durationMinutes
  levels {
    id
    name
  }
  classrooms {
    id
    name
    level {
      id
    }
  }
  rooms {
    id
    name
  }
}

fragment EvaluationSupervisionFields on EvaluationSupervisionType {
  id
  date
  room {
    id
    name
  }
  supervisors {
    id
    user {
      firstName
      lastName
    }
  }
}

fragment GradeFields on GradeType {
  id
  value
  comment
  isAbsent
  student {
    id
    matricule
    firstName
    lastName
  }
  evaluationSubject {
    id
    subject {
      name
    }
    session {
      evaluationType {
        code
        weight
      }
    }
  }
}

# ==============================================================================
# QUERIES
# ==============================================================================

query GetAllEvaluationTypes($search: String, $page: Int, $pageSize: Int) {
  evaluationTypes(search: $search, page: $page, pageSize: $pageSize) {
    items {
      ...EvaluationTypeFields
    }
    totalCount
    numPages
    currentPage
  }
}

query GetAllEvaluationSessions($search: String, $classroomId: ID, $levelId: ID, $periodId: ID, $subjectId: ID, $evaluationTypeId: ID, $page: Int, $pageSize: Int) {
  evaluationSessions(search: $search, classroomId: $classroomId, levelId: $levelId, periodId: $periodId, subjectId: $subjectId, evaluationTypeId: $evaluationTypeId, page: $page, pageSize: $pageSize) {
    items {
      ...EvaluationSessionFields
      supervisions {
        ...EvaluationSupervisionFields
      }
    }
    totalCount
    numPages
    currentPage
  }
}

query GetAllGrades($evaluationSubjectId: ID, $evaluationSessionId: ID, $studentId: ID, $academicPeriodId: ID, $classroomId: ID, $page: Int, $pageSize: Int) {
  grades(evaluationSubjectId: $evaluationSubjectId, evaluationSessionId: $evaluationSessionId, studentId: $studentId, academicPeriodId: $academicPeriodId, classroomId: $classroomId, page: $page, pageSize: $pageSize) {
    items {
      ...GradeFields
    }
    totalCount
    numPages
    currentPage
  }
}

query GetEvaluationSession($id: ID!) {
  evaluationSession(id: $id) {
    ...EvaluationSessionFields
  }
}

query GetAllEvaluationPlannings($classeId: ID, $minDate: Date, $maxDate: Date, $page: Int, $pageSize: Int) {
  evaluationPlannings(classeId: $classeId, minDate: $minDate, maxDate: $maxDate, page: $page, pageSize: $pageSize) {
    items {
      id
      date
      startTime
      durationMinutes
      evaluationSubject {
        id
        subject {
          id
          name
        }
      }
      classrooms {
        id
        name
      }
    }
    totalCount
    numPages
  }
}
