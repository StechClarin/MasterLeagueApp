<app-ui-list-page title="Rôles" description="Gérez les rôles et leurs permissions." [isLoading]="isLoading()"
    [isEmpty]="!isLoading() && (!items$ || (items$ | async)?.length === 0)">

    <!-- Header Actions -->
    <ng-container header-actions>
        <app-ui-toolbar [searchControl]="searchControl" placeholder="Rechercher un rôle...">
            <button (click)="openModal()"
                class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:bg-indigo-800 transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center font-medium text-sm">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nouveau Rôle
            </button>
        </app-ui-toolbar>
    </ng-container>

    <!-- Filters / Toolbar -->
    <ng-container filters>
        <div class="flex justify-end">
            <button (click)="openExportModal()"
                class="px-4 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-300 focus:ring-2 focus:ring-blue-200 transition-all shadow-sm flex items-center justify-center font-medium text-sm group">
                <svg class="w-5 h-5 mr-2 text-gray-400 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Exporter
            </button>
        </div>
    </ng-container>

    <!-- Table -->
    <ng-container table>
        <app-ui-table [data]="(items$ | async) || []" [columns]="tableColumns" [actionsTemplate]="actionsCell">
        </app-ui-table>

        <!-- Custom Column Templates -->
        <ng-template #permissionsCell let-role>
            <span
                class="px-3 py-1 inline-flex text-xs font-semibold rounded-full bg-blue-50 text-blue-700 border border-blue-200">
                {{ role.permissions?.length || 0 }} permissions
            </span>
        </ng-template>

        <ng-template #actionsCell let-role>
            <app-ui-dropdown [isOpen]="activeMenuId() === role.id" direction="horizontal"
                (isOpenChange)="$event ? toggleMenu(role.id) : closeMenu()">

                <!-- Trigger -->
                <button trigger
                    class="bg-indigo-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg hover:bg-indigo-700 hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
                    [ngClass]="{'ring-4 ring-indigo-500/30': activeMenuId() === role.id}">
                    <span class="sr-only">Options</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16">
                        </path>
                    </svg>
                </button>

                <!-- Menu Content -->
                <div menu class="flex items-center gap-1">
                    <button (click)="onDetails(role)"
                        class="p-2 rounded-full text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors relative group/btn"
                        title="Détails">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>

                    <button (click)="onEdit(role)"
                        class="p-2 rounded-full text-gray-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors relative group/btn"
                        title="Modifier">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                            </path>
                        </svg>
                    </button>

                    <div class="w-px h-6 bg-gray-200 mx-1"></div>

                    <button (click)="onDelete(role)"
                        class="p-2 rounded-full text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors relative group/btn"
                        title="Supprimer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                    </button>
                </div>
            </app-ui-dropdown>
        </ng-template>
    </ng-container>

    <!-- Empty Actions -->
    <ng-container empty-actions>
        <p class="text-gray-500">Aucun rôle trouvé.</p>
    </ng-container>

    <!-- Pagination -->
    <ng-container pagination>
        <app-ui-pagination [currentPage]="currentPage()" [pageSize]="pageSize()" [totalCount]="totalCount()"
            [numPages]="numPages()" (prev)="prevPage()" (next)="nextPage()"
            (goTo)="goToPage($event)"></app-ui-pagination>
    </ng-container>

    <!-- Modals -->
    <ng-container modals>
        <app-ui-modal [isOpen]="isModalOpen()" [maxWidth]="'sm:max-w-4xl'" (close)="closeModal()">
            <ng-container [ngSwitch]="modalMode()">

                <!-- Mode Détail -->
                <div *ngSwitchCase="'detail'" class="p-6 bg-white rounded-xl shadow-xl max-w-2xl mx-auto">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">Détails du Rôle: {{ selectedItem()?.name }}</h3>

                    <div class="space-y-4 max-h-[60vh] overflow-y-auto">
                        <div *ngIf="!selectedItem()?.permissions?.length" class="text-gray-500 italic">
                            Aucune permission associée.
                        </div>

                        <div *ngIf="selectedItem()?.permissions?.length">
                            <h4 class="font-semibold text-gray-700 mb-2">Permissions associées:</h4>
                            <div class="flex flex-wrap gap-2">
                                <span *ngFor="let perm of selectedItem()?.permissions"
                                    class="px-2 py-1 bg-blue-50 text-blue-700 text-xs rounded-full border border-blue-100">
                                    {{ perm.name }}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-end">
                        <button (click)="closeModal()"
                            class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">Fermer</button>
                    </div>
                </div>

                <!-- Mode Suppression -->
                <app-ui-confirm-modal *ngSwitchCase="'delete'" title="Confirmer la suppression"
                    [message]="'Voulez-vous vraiment supprimer le rôle \'' + selectedItem()?.name + '\' ?'"
                    confirmLabel="Supprimer" cancelLabel="Annuler" type="danger" (confirm)="confirmDelete()"
                    (cancel)="closeModal()">
                </app-ui-confirm-modal>

                <!-- Mode Création / Édition -->
                <div *ngSwitchDefault class="h-[80vh]">
                     <app-role-form [role]="selectedItem()" (cancel)="closeModal()" (success)="onSave()" class="h-full block">
                    </app-role-form>
                </div>

            </ng-container>
        </app-ui-modal>

        <!-- Export Modal -->
        <app-ui-export-modal [isOpen]="showExportModal()" [isExporting]="isExporting()" (close)="closeExportModal()"
            (confirm)="confirmExport($event)">
        </app-ui-export-modal>
    </ng-container>

</app-ui-list-page>
