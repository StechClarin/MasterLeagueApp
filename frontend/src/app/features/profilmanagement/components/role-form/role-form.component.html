<div class="p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">{{ isEditMode ? 'Modifier' : 'Créer' }} un Rôle</h2>

    <form [formGroup]="form" (ngSubmit)="save()">

        <!-- Nom du Rôle -->
        <div class="mb-6">
            <label for="name" class="block text-gray-700 font-medium mb-2">Nom du Rôle</label>
            <input type="text" id="name" formControlName="name"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
                placeholder="Ex: Gestionnaire RH">
            <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500 text-sm mt-1">
                Le nom est requis (min 3 chars).
            </div>
        </div>

        <!-- Permissions Groupées -->
        <div class="mb-8">
            <h3 class="text-xl font-semibold mb-4 text-gray-800">Permissions</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div *ngFor="let group of permissionGroups" class="border rounded-lg p-4 bg-gray-50">
                    <h4 class="font-bold text-lg mb-3 capitalize border-b pb-2 text-indigo-700">
                        {{ group.tag }}
                    </h4>

                    <div class="space-y-2">
                        <div *ngFor="let perm of group.permissions" class="flex items-center">
                            <input type="checkbox" [id]="'perm-' + perm.id" [checked]="isPermissionSelected(perm.id)"
                                (change)="togglePermission(perm.id, $event)"
                                class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label [for]="'perm-' + perm.id" class="ml-2 text-gray-700 text-sm cursor-pointer">
                                {{ perm.name }}
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-4">
            <button type="button" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition"
                (click)="router.navigate(['/profils/roles'])">
                Annuler
            </button>
            <button type="submit" [disabled]="form.invalid"
                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                Enregistrer
            </button>
        </div>

    </form>
</div>
