<app-ui-form [formErrors]="formErrors"
    [title]="isEditMode ? 'Modifier le Rôle' : 'Créer un Rôle'"
    [formGroup]="form"
    [submitLabel]="isEditMode ? 'Modifier' : 'Créer'"
    description="Configurez les accès et permissions système."
    (submitForm)="save()"
    (cancel)="cancel.emit()">

    <!-- Nom du Rôle -->
    <div class="mb-6">
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Nom du Rôle</label>
        <input type="text" id="name" formControlName="name"
            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all shadow-sm"
            [class.border-red-500]="form.get('name')?.invalid && form.get('name')?.touched"
            placeholder="Ex: Gestionnaire RH">
        <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500 text-xs mt-1.5 ml-1 font-medium">
            Le nom est requis (min 3 chars).
        </div>
    </div>

    <!-- Toolbar: Search & Actions -->
    <div class="flex flex-col sm:flex-row gap-4 mb-6 justify-between items-end sm:items-center bg-gray-50/50 p-4 rounded-xl border border-gray-100">
        <!-- Search -->
        <div class="w-full sm:w-1/2 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input 
                type="text" 
                [(ngModel)]="searchTerm" 
                [ngModelOptions]="{standalone: true}"
                placeholder="Filtrer les permissions..." 
                class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ease-in-out"
            >
        </div>

        <!-- Actions -->
        <div class="flex gap-2 text-sm">
            <button type="button" (click)="expandAll()" class="px-3 py-1.5 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg font-medium transition-colors">
                Tout Déplier
            </button>
            <button type="button" (click)="collapseAll()" class="px-3 py-1.5 text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 rounded-lg font-medium transition-colors">
                Tout Replier
            </button>
        </div>
    </div>

    <!-- Permissions Groupées -->
    <div class="mb-2">
        <h3 class="text-lg font-bold mb-4 text-gray-800 flex items-center">
            <span class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg mr-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11.542 17H11v2H9v2H7v2H5a2 2 0 01-2-2v-6l-3.172-3.172a6 6 0 015.743-7.744A6 6 0 0115 7z"></path></svg>
            </span>
            Permissions ({{ selectedPermissions.length }} sélectionnées)
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div *ngFor="let group of filteredPermissionGroups" 
                 class="border border-gray-200 rounded-xl bg-white hover:shadow-md transition-all duration-200 group overflow-hidden">
                
                <!-- Header (Clickable) -->
                <div (click)="toggleCollapse(group.tag)" 
                     class="p-4 bg-gray-50/50 flex justify-between items-center cursor-pointer select-none hover:bg-gray-100 transition-colors">
                    <h4 class="font-bold text-sm uppercase tracking-wider text-indigo-700 flex items-center gap-2">
                         {{ group.tag }}
                         <span class="text-xs bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full font-bold">
                            {{ group.permissions.length }}
                         </span>
                    </h4>
                    <svg class="w-5 h-5 text-gray-400 transform transition-transform duration-200" 
                         [class.rotate-180]="!isCollapsed(group.tag)"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </div>

                <!-- Content (Collapsible) -->
                <div *ngIf="!isCollapsed(group.tag)" class="p-4 pt-2 border-t border-gray-100 space-y-2">
                    <div *ngFor="let perm of group.permissions" class="flex items-start p-1.5 rounded-lg hover:bg-gray-50 transition-colors">
                        <div class="flex items-center h-5">
                            <input type="checkbox" [id]="'perm-' + perm.id" [checked]="isPermissionSelected(perm.id)"
                                (change)="togglePermission(perm.id, $event)"
                                class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer transition-all">
                        </div>
                        <label [for]="'perm-' + perm.id" class="ml-3 text-sm text-gray-700 cursor-pointer select-none flex-1">
                            {{ perm.name }}
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div *ngIf="filteredPermissionGroups.length === 0" class="text-center py-10 text-gray-500 italic">
            Aucune permission trouvée pour "{{ searchTerm }}"
        </div>
    </div>

</app-ui-form>
