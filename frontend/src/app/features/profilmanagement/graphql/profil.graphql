# ==============================================================================
# USER QUERIES
# ==============================================================================

query GetAllUsers($username: String, $email: String, $role: String, $isActive: Boolean, $page: Int, $pageSize: Int) {
  users(username: $username, email: $email, role: $role, isActive: $isActive, page: $page, pageSize: $pageSize) {
    items {
      ...UserFields
    }
    totalCount
    numPages
    currentPage
  }
}

query GetUserById($id: Int!) {
  user(id: $id) {
    ...UserFields
  }
}

# ==============================================================================
# ROLE QUERIES
# ==============================================================================

query GetAllRoles($name: String, $page: Int, $pageSize: Int) {
  roles(name: $name, page: $page, pageSize: $pageSize) {
    items {
      ...RoleFields
    }
    totalCount
    numPages
    currentPage
  }
}

query GetRoleById($id: ID!) {
  role(id: $id) {
    ...RoleFields
  }
}

# ==============================================================================
# PERMISSION QUERIES
# ==============================================================================

query GetAllPermissions {
  permissions {
    ...PermissionFields
  }
}

query GetMe {
  me {
    ...UserFields
  }
}

# ==============================================================================
# ESTABLISHMENT QUERIES
# ==============================================================================

fragment EstablishmentFields on EstablishmentType {
  id
  name
  phone
  email
  address
  logo
  isActive
  slogan
  website
  taxId
  city
  country
  printHeader
  printFooter
  user {
    id
    username
  }
}

query GetAllEstablishments($search: String, $city: String, $phone: String, $userId: ID, $isActive: Boolean, $page: Int, $pageSize: Int) {
  establishments(search: $search, city: $city, phone: $phone, userId: $userId, isActive: $isActive, page: $page, pageSize: $pageSize) {
    items {
      ...EstablishmentFields
    }
    totalCount
    numPages
    currentPage
  }
}

query GetEstablishmentById($id: ID!) {
  establishment(id: $id) {
    ...EstablishmentFields
  }
}



