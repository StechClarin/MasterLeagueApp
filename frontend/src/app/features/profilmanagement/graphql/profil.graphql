# ==============================================================================
# FRAGMENTS (DRY)
# ==============================================================================

fragment UserFields on UserType {
  id
  username
  email
  firstName
  lastName
  isActive
  dateJoined
  photo
  phone
  roles {
    id
    name
    permissions {
      id
      codename
    }
  }
}

fragment RoleFields on RoleType {
  id
  name
  permissions {
    id
    name
    codename
  }
}

fragment PermissionFields on PermissionType {
  id
  name
  codename
  tag
}

