<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dynamic Orbits -->
  <circle cx="400" cy="400" r="180" stroke="#6366F1" stroke-width="1" stroke-dasharray="10 20" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="40s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="400" r="260" stroke="#A855F7" stroke-width="1" stroke-dasharray="5 15" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="360 400 400" to="0 400 400" dur="60s" repeatCount="indefinite" />
  </circle>

  <!-- Central Core (GigaCore) -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 400) rotate(90) scale(150)">
      <stop stop-color="#6366F1" />
      <stop offset="1" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="400" cy="400" r="120" fill="url(#paint0_radial)" filter="url(#glow)" opacity="0.8">
    <animate attributeName="r" values="120;130;120" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Data Nodes -->
  <g opacity="0.8">
    <rect x="380" y="250" width="40" height="40" rx="10" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20; 0 0" dur="4s" repeatCount="indefinite" />
    </rect>
    <path d="M400 260V280M390 270H410" stroke="white" stroke-width="2" stroke-linecap="round" />
    
    <rect x="520" y="380" width="40" height="40" rx="10" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="0 0; 20 0; 0 0" dur="5s" repeatCount="indefinite" />
    </rect>
    <circle cx="540" cy="400" r="5" stroke="white" stroke-width="2" />

    <rect x="240" y="380" width="40" height="40" rx="10" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="6s" repeatCount="indefinite" />
    </rect>
    <path d="M255 400L265 400" stroke="white" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Connectors -->
  <path d="M400 290V340" stroke="white" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <path d="M460 400H520" stroke="white" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <path d="M280 400H340" stroke="white" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- Data Stream Particles -->
  <circle r="2" fill="white">
    <animateMotion path="M400 340V290" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle r="2" fill="white">
    <animateMotion path="M340 400H280" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle r="2" fill="white">
    <animateMotion path="M460 400H520" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
