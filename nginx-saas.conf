worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        # Change this to your domain when DNS is fully propagated
        server_name eteyelospace.online www.eteyelospace.online;

        # 1. REACT PORTAL (/)
        location / {
            proxy_pass http://frontend-react:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. ANGULAR ADMIN (/schoolmanage/test/ OR /eteyelo_ethernadmin/)
        # We proxy both to the existing frontend-test which handles the Angular app
        # NOTE: Angular is currently built with --base-href /schoolmanage/test/
        location /schoolmanage/test/ {
            proxy_pass http://frontend-test:80/schoolmanage/test/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /eteyelo_ethernadmin/ {
            proxy_pass http://frontend-test:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. DJANGO API & GRAPHQL
        location /api/ {
            proxy_pass http://backend-test:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /graphql {
            proxy_pass http://backend-test:8000/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Static and Media
        location /static/ {
            proxy_pass http://frontend-test:80/static/;
            proxy_set_header Host $host;
        }
        location /media/ {
            proxy_pass http://frontend-test:80/media/;
            proxy_set_header Host $host;
        }
    }
}
